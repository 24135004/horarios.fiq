                const cursoNombreCompleto = col2.substring(0, planIndex).trim();
                
                // Extraer el código del curso (Ej: IEGH06) y dejar el nombre limpio
                const codeMatch = cursoNombreCompleto.match(/-\s*([A-Z0-9]+)$/);
                const codigo = codeMatch ? codeMatch[1] : "FIQ";
                const cursoNombre = cursoNombreCompleto.replace(/-\s*[A-Z0-9]+$/, '').trim();

                const col2Words = col2.split(' ');
                const dia = col2Words.pop();
                
                let seccion = col2Words.pop();
                let subSeccion = "";
                if (seccion.includes('G)') || seccion.includes('G(')) {
                    subSeccion = seccion;
                    seccion = col2Words.pop();
                    seccion = seccion + " " + subSeccion;
                }

                const planMatch = col2.match(/PLAN \d{4}\*? /);
                let docente = "POR DESIGNAR PROFESOR";
                if (planMatch) {
                    const planStr = planMatch[0];
                    const startDocente = col2.indexOf(planStr) + planStr.length;
                    const endDocente = col2.lastIndexOf(seccion.split(' ')[0]) - 1;
                    let docRaw = col2.substring(startDocente, endDocente).trim();
                    docRaw = docRaw.replace(/\s*-\s*\d+$/, '').trim();
                    if(docRaw) docente = docRaw;
                }

                const timeMatch = col3.match(/(\d{2}:\d{2})\s+a\s+(\d{2}:\d{2})/);
                if (!timeMatch) return;
                const inicio = timeMatch[1];
                const fin = timeMatch[2];

                const restCol3 = col3.substring(timeMatch[0].length).trim().split(' ');
                let tipo = "T";
                let cupos = "40";
                const tipoIndex = restCol3.findIndex(w => w === 'T' || w === 'P' || w === 'L');
                if (tipoIndex !== -1) {
                    tipo = restCol3[tipoIndex];
                    cupos = restCol3[tipoIndex + 1] || "40";
                }
                
                let modalIndex = restCol3.findIndex(w => w === 'PRESENCIAL' || w === 'VIRTUAL');
                let aula = modalIndex > 0 ? restCol3.slice(0, modalIndex).join(' ') : "LAB";
                if (!aula) aula = "LAB";

                if (!courseMap[cursoNombre]) {
                    courseMap[cursoNombre] = { id: cursoNombre, nombre: cursoNombre, codigo: codigo, ciclo: ciclo, creditos: 4, seccionesBase: {} };
                }

                const baseSeccion = seccion.split(' ')[0];
                
                if (!courseMap[cursoNombre].seccionesBase[baseSeccion]) {
                    courseMap[cursoNombre].seccionesBase[baseSeccion] = {
                        id: `${cursoNombre}_${baseSeccion}`, seccion: baseSeccion, 
                        tp: [], labs: {}
                    };
                }

                const claseObj = { dia, inicio, fin, tipo, aula, docente, cupos };

                if (tipo === 'L' || seccion.includes('G')) {
                    if (!courseMap[cursoNombre].seccionesBase[baseSeccion].labs[seccion]) {
                        courseMap[cursoNombre].seccionesBase[baseSeccion].labs[seccion] = [];
                    }
                    courseMap[cursoNombre].seccionesBase[baseSeccion].labs[seccion].push(claseObj);
                } else {
                    courseMap[cursoNombre].seccionesBase[baseSeccion].tp.push(claseObj);
                }
            });

            return Object.values(courseMap);
        };

        const dbCursos = parseData();
        const borderColors = ['bg-purple-600', 'bg-emerald-600', 'bg-blue-600', 'bg-orange-500', 'bg-pink-600', 'bg-cyan-600'];

        // Helper Modal Component
        const ModalWrapper = ({ isOpen, onClose, title, icon, subtitle, children, footer, maxWidth="max-w-2xl" }) => {

        // === COMPONENTE REACT PRINCIPAL ===
        const App = () => {
            const [seccionesAgregadas, setSeccionesAgregadas] = useState([]);
            const [historial, setHistorial] = useState([]); // Historial para el botón Deshacer
            const [filtroCiclo, setFiltroCiclo] = useState('Todos');
            const [busqueda, setBusqueda] = useState('');
            const [isSidebarOpen, setIsSidebarOpen] = useState(window.innerWidth >= 1024);
            const [modals, setModals] = useState({ misHorarios: false, estadisticas: false, ajustes: false, galeria: false });
            const [toast, setToast] = useState({ visible: false, message: '', type: 'success' });
            
            const calendarRef = useRef(null);

            // Responsive de la barra lateral
            useEffect(() => {
                const handleResize = () => {
                    if (window.innerWidth >= 1024) setIsSidebarOpen(true);
                    else setIsSidebarOpen(false);
                };
                window.addEventListener('resize', handleResize);
                return () => window.removeEventListener('resize', handleResize);
            }, []);

            const showToast = (msg, type='success') => {
                setToast({ visible: true, message: msg, type });
                setTimeout(() => setToast({ visible: false, message: '', type }), 3000);
            };

            const timeToMins = (timeStr) => {
                if(!timeStr) return 0;
                const [h, m] = timeStr.split(':').map(Number);
                return (h * 60) + m;
            };

            // Cálculos Estadísticos Unificados
            const { totalCreditos, crucesCount, horasSemanales, horasLibres, dist } = useMemo(() => {
                let creditos = 0;
                let cruces = 0;
                let minsClase = 0;
                let huecosMins = 0;
                const distClass = { t: 0, p: 0, l: 0 };
                const uniqueCursos = new Set();
                
                const bloques = [];
                const diasMap = {};

                seccionesAgregadas.forEach(sec => {
                    if (!uniqueCursos.has(sec.cursoId)) { 
                        creditos += (sec.creditos || 4); 
                        uniqueCursos.add(sec.cursoId); 
                    }

                    sec.horarios.forEach(h => {
                        const start = timeToMins(h.inicio);
                        const end = timeToMins(h.fin);
                        
                        minsClase += (end - start);
                        bloques.push({ dia: h.dia, inicio: start, fin: end });
                        
                        if(!diasMap[h.dia]) diasMap[h.dia] = [];
                        diasMap[h.dia].push({ start, end });

                        if (h.tipo === 'T') distClass.t++;
                        else if (h.tipo === 'P') distClass.p++;
                        else if (h.tipo === 'L') distClass.l++;
                    });
                });

                // Cruces
                for(let i=0; i < bloques.length; i++){
                    for(let j=i+1; j < bloques.length; j++){
                        const b1 = bloques[i], b2 = bloques[j];
                        if(b1.dia === b2.dia && b1.inicio < b2.fin && b1.fin > b2.inicio) cruces++;
                    }
                }

                // Huecos
                Object.values(diasMap).forEach(clases => {
                    clases.sort((a,b) => a.start - b.start);
                    for(let i=0; i<clases.length-1; i++){
                        const gap = clases[i+1].start - clases[i].end;
                        if (gap > 0) huecosMins += gap;
                    }
                });

                return {
                    totalCreditos: creditos,
                    crucesCount: cruces,
                    horasSemanales: Math.round(minsClase / 60),
                    horasLibres: Math.round(huecosMins / 60),
                    dist: distClass
                };
            }, [seccionesAgregadas]);

            const cursosFiltrados = dbCursos.filter(c => {
                const matchCiclo = filtroCiclo === 'Todos' || c.ciclo === filtroCiclo;
                const searchTxt = busqueda.toLowerCase();
                const matchBus = c.nombre.toLowerCase().includes(searchTxt) || 
                                 Object.values(c.seccionesBase).some(b => 
                                     b.tp.some(h => h.docente.toLowerCase().includes(searchTxt)) ||
                                     Object.values(b.labs).some(labArr => labArr.some(h => h.docente.toLowerCase().includes(searchTxt)))
                                 );
                return matchCiclo && matchBus;
            });

            const cursosPorCiclo = useMemo(() => {
                return cursosFiltrados.reduce((acc, curso) => {
                    if (!acc[curso.ciclo]) acc[curso.ciclo] = [];
                    acc[curso.ciclo].push(curso);
                    return acc;
                }, {});
            }, [cursosFiltrados]);

            const toggleSeccion = (curso, itemID, nombreSeccion, horariosArray, itemType) => {
                setHistorial(prev => [...prev, seccionesAgregadas]); // Guardar paso previo para Deshacer

                const isAdded = seccionesAgregadas.some(s => s.id === itemID);

                if (isAdded) {
                    newArr = seccionesAgregadas.filter(s => s.id !== itemID);
                    showToast(`${curso.nombre} (Sec ${nombreSeccion}) removida`);
                } else {
                    const clean = seccionesAgregadas.filter(s => {
                        if (s.cursoId !== curso.id) return true;
                        return s.itemType !== itemType;

                    newArr = [...clean, {

                        seccion: nombreSeccion, horarios: horariosArray, itemType: itemType, creditos: curso.creditos

                    setHistorial(prev => [...prev, seccionesAgregadas]);

            const exportarPNG = () => {

                        const imgData = canvas.toDataURL('image/png');
                        const { jsPDF } = window.jspdf;
                        const pdf = new jsPDF('l', 'mm', 'a4');
                        const pdfWidth = pdf.internal.pageSize.getWidth();
                        const pdfHeight = (canvas.height * pdfWidth) / canvas.width;
                        pdf.addImage(imgData, 'PNG', 0, 0, pdfWidth, pdfHeight);
                        pdf.save('Mi_Horario_CEET_FIQ.pdf');
                        setModals({...modals, galeria: false});
                        showToast("Horario descargado en PDF");
                    });

            const diasSemana = ['Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];
            const HORA_INICIO = 8;
            const HORA_FIN = 23;
            const TOTAL_HORAS = HORA_FIN - HORA_INICIO;

            return (
                <div className="flex h-screen w-full relative">

                    {toast.visible && (

                            <i className="fa-regular fa-circle-check text-lg text-emerald-500"></i>
                            <div className="text-sm font-bold text-slate-700">{toast.message}</div>
                            <button onClick={() => setToast({visible: false})} className="text-slate-400 hover:text-slate-600 ml-2"><i className="fa-solid fa-xmark"></i></button>
                        </div>
                    )}

                    {/* VENTANAS MODALES */}
                    
                    {/* Modal 1: Mis Horarios Guardados */}
                    <ModalWrapper isOpen={modals.misHorarios} onClose={() => setModals({...modals, misHorarios: false})} title="Mis Horarios Guardados" icon={<i className="fa-solid fa-folder-open text-[#5c4cfc]"></i>} subtitle="Carga o elimina tus distintas alternativas de horarios guardados previamente.">
                        <div className="border-2 border-dashed border-slate-200 bg-slate-50 rounded-2xl p-10 flex flex-col items-center justify-center text-center">
                            <i className="fa-regular fa-calendar text-4xl text-slate-300 mb-4"></i>
                            <p className="text-sm font-black text-slate-600 mb-1">Aún no has guardado ningún horario.</p>
                            <p className="text-[11px] font-medium text-slate-400 max-w-sm">Haz clic en "Guardar Horario" en la barra de herramientas para guardar tu combinación actual.</p>
                        </div>
                    </ModalWrapper>

                    {/* Modal 2: Estadísticas */}
                    <ModalWrapper isOpen={modals.estadisticas} onClose={() => setModals({...modals, estadisticas: false})} title="Estadísticas del Horario" icon={<i className="fa-solid fa-chart-column text-[#5c4cfc]"></i>} subtitle="Resumen de métricas de carga académica y distribución de tiempo.">
                        <div className="grid grid-cols-2 gap-4 mb-5">
                            <div className="bg-indigo-50/50 border border-indigo-100 p-4 rounded-xl">
                                <p className="text-[11px] text-slate-500 font-bold mb-1">Créditos Inscritos</p>
                                <p className="text-2xl font-black text-indigo-600">{totalCreditos} Cr.</p>

                    </ModalWrapper>

                    {/* Modal 3: Ajustes Avanzados */}

                    </ModalWrapper>

                    {/* Modal 4: Galería de Exportación */}
                    <ModalWrapper isOpen={modals.galeria} onClose={() => setModals({...modals, galeria: false})} maxWidth="max-w-4xl" title="Galería de Diseños UNAC" icon={<i className="fa-solid fa-wand-magic-sparkles text-[#5c4cfc]"></i>} subtitle="Selecciona tu plantilla favorita y descárgala en formato PNG, PDF, SVG o Excel."
                        footer={
                            <div className="p-4 border-t border-slate-100 bg-slate-50 flex items-center justify-between flex-wrap gap-3 rounded-b-2xl">
                                <div className="flex items-center gap-3">
                                    <button onClick={() => setModals({...modals, galeria: false})} className="bg-white border border-slate-200 text-slate-600 px-4 py-2 rounded-lg text-xs font-bold hover:bg-slate-100 flex items-center gap-2 shadow-sm">
                                        <i className="fa-solid fa-arrow-left"></i> Volver a editar

                                <div className="flex items-center gap-2">

                                                {diasSemana.map((_, i) => (<div key={i} className="flex-1 border-r border-slate-100 last:border-0 grid-bg"></div>))}
                                            </div>
                                            
                                            <div className="absolute top-0 left-0 w-14 text-center text-[10px] text-slate-500 font-bold z-10">
                                                {Array.from({length: TOTAL_HORAS + 1}).map((_, i) => (
                                                    <div key={i} className="h-[60px] relative border-b border-slate-100 bg-white">
                                                        <span className="absolute -top-2 left-0 w-full"><span className="text-slate-800 font-black">{String(i + HORA_INICIO).padStart(2, '0')}</span>:00</span>
                                                    </div>
                                                ))}
                                            </div>

                                            {/* BLOQUES RENDERIZADOS SEGÚN TU IMAGEN */}
                                            {seccionesAgregadas.map((seccion, sIdx) => {
                                                // Colores suaves para asemejarse al screenshot minimalista
                                                const colores = ['bg-[#eef2ff] border-[#3b82f6] text-[#1e3a8a]', 'bg-[#ecfdf5] border-[#10b981] text-[#064e3b]', 'bg-[#fffbeb] border-[#f59e0b] text-[#78350f]', 'bg-[#fdf2f8] border-[#f43f5e] text-[#831843]', 'bg-[#f0fdf4] border-[#059669] text-[#022c22]'];
                                                const color = seccion.itemType === 'LAB' ? 'bg-[#faf5ff] border-[#a855f7] text-[#581c87]' : colores[sIdx % colores.length];

                                                return seccion.horarios.map((horario, hIdx) => {
                                                    const colIndex = diasSemana.indexOf(horario.dia);
                                                    if (colIndex === -1) return null;
                                                    const startMin = timeToMins(horario.inicio);
                                                    const offsetTop = startMin - (HORA_INICIO * 60);
                                                    const duration = timeToMins(horario.fin) - startMin;

                                                    return (
                                                        <div 
                                                            key={`${sIdx}-${hIdx}`}
                                                            className={`absolute class-block rounded-lg border-l-[4px] p-2 flex flex-col items-center justify-center text-[10px] overflow-hidden z-20 ${color} shadow-sm`}
                                                            style={{ top: `${offsetTop}px`, height: `${duration}px`, width: `calc((100% - 56px) / 6 - 8px)`, left: `calc(56px + ((100% - 56px) / 6) * ${colIndex} + 4px)` }}
                                                        >
                                                            <span className="font-black leading-tight mb-1 text-center uppercase tracking-tighter" style={{fontSize:'9px'}}>{seccion.nombreCurso}</span>
                                                            <span className="font-bold text-[8px] opacity-90 text-center w-full mb-1">Sec. {seccion.seccion}</span>
                                                            
                                                            <div className="flex flex-col gap-1 items-center">
                                                                <span className="font-black bg-white/70 px-1.5 py-0.5 rounded shadow-sm w-max text-[8px] flex items-center gap-1 border border-black/5">
                                                                    {horario.aula} <span className="text-[#5c4cfc]">[ {horario.tipo} ]</span>
                                                                </span>
                                                                <span className="text-[8px] font-bold flex items-center gap-1 opacity-90"><i className="fa-regular fa-clock"></i> {horario.inicio} a {horario.fin}</span>
                                                            </div>
                                                        </div>
                                                    )
                                                });
                                            })}
                                        </div>
                                    </div>
                                    
                                    {seccionesAgregadas.length === 0 && (
                                        <div className="absolute inset-0 flex flex-col items-center justify-center pointer-events-none opacity-90 z-30 bg-white/70">
                                            <div className="bg-white p-6 rounded-2xl shadow-xl border border-slate-100 flex flex-col items-center text-center max-w-sm">
                                                <div className="w-16 h-16 bg-emerald-50 rounded-full flex items-center justify-center mb-4"><i className="fa-regular fa-calendar-check text-3xl text-emerald-500"></i></div>
                                                <h3 className="text-lg font-black text-slate-800 mb-2">Arma tu horario ideal</h3>
                                                <p className="text-xs text-slate-500 mb-5 font-medium px-4">Haz clic en cualquier curso del catálogo a la izquierda para comenzar a armar tu horario semanal.</p>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>

                        {/* FOOTER 3D GLOBE Y CRÉDITOS */}
                        <div className="footer-container w-full mt-auto flex flex-col items-center justify-center shrink-0 shadow-[0_-10px_30px_rgba(0,0,0,0.5)]">
                            <div className="globe-container">
                                <div className="globe">
                                    <div className="ring"></div><div className="ring"></div><div className="ring"></div>
                                    <div className="ring"></div><div className="ring"></div><div className="ring"></div>
                                    <div className="ring"></div>
                                </div>
                            </div>
                            <div className="creator-text">S I S T E M A &nbsp; C R E A D O &nbsp; P O R &nbsp; S E B A S T I A N</div>
                            <div className="copyright-text">© 2026 UNAC - Integración Estudiantil. Todos los derechos reservados.</div>
                        </div>

                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
