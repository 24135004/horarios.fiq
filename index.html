                const col3 = parts[2].trim(); // Hora, Aula, Dictado, Tipo, Cupos...

                // Extraer nombre del curso (Todo antes de " PLAN ")
                const planIndex = col2.indexOf(" PLAN ");
                if (planIndex === -1) return;
                const cursoNombre = col2.substring(0, planIndex).trim();

                // Extraer Dia (Última palabra de col2)
                const col2Words = col2.split(' ');
                const dia = col2Words.pop();
                
                // Extraer Seccion (Penúltima palabra de col2)
                let seccion = col2Words.pop();
                let subSeccion = "";
                // Manejar si la seccion es tipo "(90G)" -> entonces la anterior es la base "01Q"
                if (seccion.includes('G)') || seccion.includes('G(')) {
                    subSeccion = seccion;
                    seccion = col2Words.pop();
                    seccion = seccion + " " + subSeccion;
                }

                // Docente (Lo que queda entre PLAN XXXX y la seccion)
                const planMatch = col2.match(/PLAN \d{4}\*? /);
                let docente = "POR DESIGNAR PROFESOR";
                if (planMatch) {
                    const planStr = planMatch[0];
                    const startDocente = col2.indexOf(planStr) + planStr.length;
                    const endDocente = col2.lastIndexOf(seccion.split(' ')[0]) - 1;
                    let docRaw = col2.substring(startDocente, endDocente).trim();
                    // Limpiar codigo final del docente si existe ej: " - 2425"
                    docRaw = docRaw.replace(/\s*-\s*\d+$/, '').trim();
                    if(docRaw) docente = docRaw;
                }

                // Parsear col 3 (Hora, Aula, Modalidad, Tipo)
                // Ej: "08:00 a 10:30 FIQ1A03 PRESENCIAL T 90 Completado CALLAO" o "13:50 a 17:10 PRESENCIAL L 40 Completado CALLAO"
                const timeMatch = col3.match(/(\d{2}:\d{2})\s+a\s+(\d{2}:\d{2})/);
                if (!timeMatch) return;
                const inicio = timeMatch[1];
                const fin = timeMatch[2];

                const restCol3 = col3.substring(timeMatch[0].length).trim().split(' ');
                // Buscar tipo (T, P, L)
                const tipoIndex = restCol3.findIndex(w => w === 'T' || w === 'P' || w === 'L');
                if (tipoIndex === -1) return;
                const tipo = restCol3[tipoIndex];
                
                // Aula (Lo que está antes de PRESENCIAL/VIRTUAL, o si no hay, es LAB o igual)
                let modalIndex = restCol3.findIndex(w => w === 'PRESENCIAL' || w === 'VIRTUAL');
                let aula = modalIndex > 0 ? restCol3.slice(0, modalIndex).join(' ') : "LAB";
                if (!aula) aula = "LAB";

                // Agregar a estructura
                if (!courseMap[cursoNombre]) {
                    courseMap[cursoNombre] = { id: cursoNombre, nombre: cursoNombre, ciclo: ciclo, creditos: 4, seccionesBase: {} };
                }

                // Identificar la sección base (ej. "01Q")
                const baseSeccion = seccion.split(' ')[0];
                
                if (!courseMap[cursoNombre].seccionesBase[baseSeccion]) {
                    courseMap[cursoNombre].seccionesBase[baseSeccion] = {
                        id: `${cursoNombre}_${baseSeccion}`, seccion: baseSeccion, 
                        tp: [], // Clases de Teoría y Práctica
                        labs: {} // Clases de Laboratorio separados por su subcodigo (ej. 90G)
                    };
                }

                const claseObj = { dia, inicio, fin, tipo, aula, docente };

                if (tipo === 'L' || seccion.includes('G')) {
                    if (!courseMap[cursoNombre].seccionesBase[baseSeccion].labs[seccion]) {
                        courseMap[cursoNombre].seccionesBase[baseSeccion].labs[seccion] = [];
                    }
                    courseMap[cursoNombre].seccionesBase[baseSeccion].labs[seccion].push(claseObj);
                } else {
                    courseMap[cursoNombre].seccionesBase[baseSeccion].tp.push(claseObj);
                }
            });

            return Object.values(courseMap);
        };

        const dbCursos = parseData();

        // === COMPONENTE PRINCIPAL ===
        const App = () => {
            const [seccionesAgregadas, setSeccionesAgregadas] = useState([]);
            const [filtroCiclo, setFiltroCiclo] = useState('Todos');
            const [busqueda, setBusqueda] = useState('');

            const timeToMins = (timeStr) => {
                if(!timeStr) return 0;
                const [h, m] = timeStr.split(':').map(Number);
                return (h * 60) + m;
            };

            const crucesCount = useMemo(() => {
                let cruces = 0;
                const bloques = [];
                seccionesAgregadas.forEach(sec => {
                    sec.horarios.forEach(hor => {
                        bloques.push({ dia: hor.dia, inicio: timeToMins(hor.inicio), fin: timeToMins(hor.fin) });
                    });
                });
                for(let i=0; i < bloques.length; i++){
                    for(let j=i+1; j < bloques.length; j++){
                        const b1 = bloques[i], b2 = bloques[j];
                        if(b1.dia === b2.dia && b1.inicio < b2.fin && b1.fin > b2.inicio) cruces++;
                    }
                }
                return cruces;
            }, [seccionesAgregadas]);

            const cursosFiltrados = dbCursos.filter(c => {
                const matchCiclo = filtroCiclo === 'Todos' || c.ciclo === filtroCiclo;
                const searchTxt = busqueda.toLowerCase();
                const matchBus = c.nombre.toLowerCase().includes(searchTxt) || 
                                 Object.values(c.seccionesBase).some(b => 
                                     b.tp.some(h => h.docente.toLowerCase().includes(searchTxt)) ||
                                     Object.values(b.labs).some(labArr => labArr.some(h => h.docente.toLowerCase().includes(searchTxt)))
                                 );
                return matchCiclo && matchBus;
            });

            // Lógica para Agregar/Quitar
            // itemType = "TP" o "LAB"
            const toggleSeccion = (curso, itemID, nombreSeccion, horariosArray, itemType) => {
                const isAdded = seccionesAgregadas.some(s => s.id === itemID);
                if (isAdded) {
                    setSeccionesAgregadas(seccionesAgregadas.filter(s => s.id !== itemID));
                } else {
                    // Si agrego TP, borro otros TP de este curso. Si agrego LAB, borro otros LAB de este curso.
                    const clean = seccionesAgregadas.filter(s => {
                        if (s.cursoId !== curso.id) return true;
                        return s.itemType !== itemType; 
                    });
                    setSeccionesAgregadas([...clean, { 
                        id: itemID, cursoId: curso.id, nombreCurso: curso.nombre, 
                        seccion: nombreSeccion, horarios: horariosArray, itemType: itemType 
                    }]);
                }
            };

            const diasSemana = ['Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];
            const HORA_INICIO = 8;
            const HORA_FIN = 23;
            const TOTAL_HORAS = HORA_FIN - HORA_INICIO;

            return (
                <div className="flex flex-col h-full bg-slate-100">
                    {/* Header Institucional */}
                    <header className="bg-unac text-white px-8 py-5 shadow-lg flex justify-between items-center shrink-0 z-20">
                        <div className="flex items-center gap-5">
                            <div className="w-14 h-14 bg-white rounded-xl flex items-center justify-center text-unac font-black text-2xl shadow-inner border border-slate-200">FIQ</div>
                            <div>
                                <h1 className="text-2xl font-black tracking-wide text-white drop-shadow-md">CEET FIQ <span className="font-light opacity-80">| Horarios Profesionales</span></h1>
                                <p className="text-sm text-gold-light mt-0.5 font-medium tracking-wide">"Crecemos juntos, aprendemos mejor"</p>
                            </div>
                        </div>
                        <div className="hidden md:flex items-center gap-4 text-sm font-bold bg-unac-dark px-5 py-2.5 rounded-full border border-unac-accent shadow-md">
                            <i className="fa-solid fa-clock text-gold"></i> Ciclo Académico 2026-B
                        </div>
                    </header>

                    {/* Resumen / Estadísticas */}
                    <div className="px-8 py-5 grid grid-cols-2 md:grid-cols-4 gap-6 shrink-0 bg-white border-b border-slate-200 shadow-sm z-10">
                        <div className="flex items-center gap-4 bg-slate-50 p-4 rounded-2xl border border-slate-200 shadow-sm transition-transform hover:-translate-y-1">
                            <div className="w-12 h-12 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center text-xl shadow-inner"><i className="fa-solid fa-graduation-cap"></i></div>
                            <div><p className="text-2xl font-black text-slate-800">{new Set(seccionesAgregadas.map(s=>s.cursoId)).size}</p><p className="text-[11px] text-slate-500 font-bold uppercase tracking-wider">Cursos Elegidos</p></div>
                        </div>
                        <div className="flex items-center gap-4 bg-slate-50 p-4 rounded-2xl border border-slate-200 shadow-sm transition-transform hover:-translate-y-1">
                            <div className="w-12 h-12 rounded-full bg-purple-100 text-purple-600 flex items-center justify-center text-xl shadow-inner"><i className="fa-solid fa-flask"></i></div>
                            <div><p className="text-2xl font-black text-slate-800">{seccionesAgregadas.filter(s=>s.itemType==='LAB').length}</p><p className="text-[11px] text-slate-500 font-bold uppercase tracking-wider">Laboratorios</p></div>
                        </div>
                        <div className={`flex items-center gap-4 p-4 rounded-2xl border shadow-sm transition-all hover:-translate-y-1 ${crucesCount > 0 ? 'bg-red-50 border-red-300' : 'bg-slate-50 border-slate-200'}`}>
                            <div className={`w-12 h-12 rounded-full flex items-center justify-center text-xl shadow-inner ${crucesCount > 0 ? 'bg-red-200 text-red-700' : 'bg-slate-200 text-slate-500'}`}><i className="fa-solid fa-triangle-exclamation"></i></div>
                            <div><p className={`text-2xl font-black ${crucesCount > 0 ? 'text-red-600' : 'text-slate-800'}`}>{crucesCount}</p><p className="text-[11px] text-slate-500 font-bold uppercase tracking-wider">Cruces Horarios</p></div>
                        </div>
                        <div className="flex items-center justify-center">
                            <button className="bg-unac hover:bg-unac-dark transition-all text-white font-bold py-3.5 px-6 rounded-2xl w-full h-full shadow-lg shadow-unac/30 border border-unac-accent flex items-center justify-center gap-3 text-lg" onClick={() => window.print()}>
                                <i className="fa-solid fa-print"></i> Exportar Horario
                            </button>
                        </div>
                    </div>

                    {/* Contenido (Catálogo + Calendario) */}
                    <div className="flex-1 flex overflow-hidden p-8 gap-8">
                        
                        {/* CATÁLOGO DE CURSOS (Izquierda) */}
                        <div className="w-1/3 min-w-[380px] max-w-[460px] bg-white rounded-3xl border border-slate-200 flex flex-col shadow-xl overflow-hidden h-full relative z-10">
                            <div className="p-6 border-b border-slate-100 bg-slate-50">
                                <h2 className="font-black text-slate-800 text-lg mb-4 flex items-center gap-2"><i className="fa-solid fa-list-check text-unac"></i> Catálogo Completo FIQ</h2>
                                <div className="space-y-3">
                                    <div className="relative shadow-sm">
                                        <i className="fa-solid fa-magnifying-glass absolute left-4 top-3.5 text-slate-400 text-sm"></i>
                                        <input type="text" placeholder="Busca por curso, profesor..." className="w-full pl-10 pr-4 py-3 bg-white border border-slate-300 rounded-xl text-sm font-medium focus:outline-none focus:border-unac focus:ring-2 focus:ring-unac/20 transition-all" value={busqueda} onChange={(e) => setBusqueda(e.target.value)} />
                                    </div>
                                    <select className="w-full px-4 py-3 bg-white border border-slate-300 rounded-xl text-sm font-bold text-slate-700 shadow-sm focus:outline-none focus:border-unac focus:ring-2 focus:ring-unac/20 transition-all cursor-pointer" value={filtroCiclo} onChange={(e) => setFiltroCiclo(e.target.value)}>
                                        <option value="Todos">Ver Todos los Ciclos (I al X)</option>
                                        <option value="I">Ciclo I</option><option value="II">Ciclo II</option><option value="III">Ciclo III</option><option value="IV">Ciclo IV</option><option value="V">Ciclo V</option><option value="VI">Ciclo VI</option><option value="VII">Ciclo VII</option><option value="VIII">Ciclo VIII</option><option value="IX">Ciclo IX</option><option value="X">Ciclo X</option>
                                    </select>
                                </div>
                            </div>
                            
                            <div className="flex-1 overflow-y-auto scroll-clean p-4 bg-slate-50/50">
                                {cursosFiltrados.length === 0 ? (
                                    <div className="text-center p-10 text-slate-400 opacity-60"><i className="fa-solid fa-folder-open text-5xl mb-4"></i><p className="font-medium text-lg">Sin resultados</p></div>
                                ) : (
                                    cursosFiltrados.map(curso => (
                                        <div key={curso.id} className="mb-5 bg-white border border-slate-200 rounded-2xl shadow-sm overflow-hidden hover:shadow-md transition-shadow">
                                            <div className="p-4 border-b border-slate-100 bg-unac/5">
                                                <h3 className="font-black text-sm uppercase text-unac leading-tight">{curso.nombre}</h3>
                                                <div className="mt-2 inline-block bg-unac text-white px-2 py-0.5 rounded text-[10px] font-bold tracking-wide">CICLO {curso.ciclo}</div>
                                            </div>
                                            
                                            <div className="p-3 space-y-4">
                                                {Object.values(curso.seccionesBase).map(base => {
                                                    const hasTP = base.tp.length > 0;
                                                    const labs = Object.keys(base.labs);
                                                    
                                                    // ID para Teoría/Práctica
                                                    const tpID = `${curso.id}_${base.seccion}_TP`;
                                                    const isTPAdded = seccionesAgregadas.some(s => s.id === tpID);

                                                    return (
                                                        <div key={base.id} className="bg-slate-50 border border-slate-200 rounded-xl p-3 shadow-inner">
                                                            
                                                            {/* Bloque de Teoría/Práctica principal */}
                                                            {hasTP && (
                                                                <div className={`rounded-lg p-2.5 transition-all border-2 ${isTPAdded ? 'border-unac bg-blue-50/80 shadow-sm' : 'border-transparent bg-white hover:border-slate-300'}`}>
                                                                    <div className="flex justify-between items-center mb-2.5">
                                                                        <h4 className="font-black text-[13px] text-slate-800">Sección {base.seccion} <span className="text-[10px] font-semibold text-slate-400 ml-1">(Teoría/Prác)</span></h4>
                                                                        <button onClick={() => toggleSeccion(curso, tpID, base.seccion, base.tp, 'TP')} className={`w-8 h-8 rounded-lg flex items-center justify-center text-sm shadow-sm transition-all ${isTPAdded ? 'bg-red-500 text-white hover:bg-red-600' : 'bg-slate-100 text-slate-600 hover:bg-unac hover:text-white'}`}>
                                                                            <i className={`fa-solid ${isTPAdded ? 'fa-xmark' : 'fa-plus'}`}></i>
                                                                        </button>
                                                                    </div>
                                                                    <div className="space-y-1.5">
                                                                        {base.tp.map((h, i) => (
                                                                            <div key={i} className="flex flex-col bg-slate-100/80 rounded-md px-2.5 py-1.5 border border-slate-100">
                                                                                <span className="text-[10px] font-bold text-slate-600 truncate mb-1" title={h.docente}><i className="fa-solid fa-chalkboard-user mr-1 text-slate-400"></i> {h.docente}</span>
                                                                                <div className="flex justify-between items-center text-[11px]">
                                                                                    <span className="font-black text-slate-700 w-8">{h.dia}</span>
                                                                                    <span className="text-slate-600 font-semibold">{h.inicio} - {h.fin}</span>
                                                                                    <span className="font-black text-unac bg-unac/10 px-1.5 rounded">{h.tipo} | {h.aula}</span>
                                                                                </div>
                                                                            </div>
                                                                        ))}
                                                                    </div>
                                                                </div>
                                                            )}

                                                            {/* Bloque de Laboratorios Anidados Debajo (Requisito Especial) */}
                                                            {labs.length > 0 && (
                                                                <div className="mt-3 pl-3 border-l-2 border-purple-200">
                                                                    <p className="text-[10px] font-bold text-purple-600 uppercase tracking-wider mb-2"><i className="fa-solid fa-flask mr-1"></i> Laboratorios Disponibles</p>
                                                                    <div className="space-y-2">
                                                                        {labs.map(labSec => {
                                                                            const labHorarios = base.labs[labSec];
                                                                            const labID = `${curso.id}_${labSec}_LAB`;
                                                                            const isLabAdded = seccionesAgregadas.some(s => s.id === labID);

                                                                            return (
                                                                                <div key={labSec} className={`rounded-lg p-2 transition-all border-2 ${isLabAdded ? 'border-purple-500 bg-purple-50 shadow-sm' : 'border-slate-200 bg-white hover:border-purple-300'}`}>
                                                                                    <div className="flex justify-between items-center mb-1.5">
                                                                                        <h4 className="font-bold text-[11px] text-slate-700 flex items-center gap-1.5">
                                                                                            {labSec} <span className="bg-purple-100 text-purple-700 text-[9px] px-1.5 py-0.5 rounded font-black">LAB</span>
                                                                                        </h4>
                                                                                        <button onClick={() => toggleSeccion(curso, labID, labSec, labHorarios, 'LAB')} className={`w-6 h-6 rounded-md flex items-center justify-center text-xs shadow-sm transition-all ${isLabAdded ? 'bg-red-500 text-white hover:bg-red-600' : 'bg-slate-100 text-slate-600 hover:bg-purple-600 hover:text-white'}`}>
                                                                                            <i className={`fa-solid ${isLabAdded ? 'fa-xmark' : 'fa-plus'}`}></i>
                                                                                        </button>
                                                                                    </div>
                                                                                    <div className="space-y-1">
                                                                                        {labHorarios.map((h, i) => (
                                                                                            <div key={i} className="flex flex-col bg-slate-50 rounded px-2 py-1.5 border border-slate-100">
                                                                                                <span className="text-[9px] font-bold text-slate-500 truncate mb-1"><i className="fa-solid fa-user mr-1 text-slate-300"></i> {h.docente}</span>
                                                                                                <div className="flex justify-between items-center text-[10px]">
                                                                                                    <span className="font-bold text-slate-700 w-6">{h.dia}</span>
                                                                                                    <span className="text-slate-600 font-semibold">{h.inicio} - {h.fin}</span>
                                                                                                    <span className="font-black text-purple-600">{h.aula}</span>
                                                                                                </div>
                                                                                            </div>
                                                                                        ))}
                                                                                    </div>
                                                                                </div>
                                                                            )
                                                                        })}
                                                                    </div>
                                                                </div>
                                                            )}
                                                        </div>
                                                    )
                                                })}
                                            </div>
                                        </div>
                                    ))
                                )}
                            </div>
                        </div>

                        {/* PANEL DERECHO: CALENDARIO VISUAL EXACTO */}
                        <div className="flex-1 bg-white rounded-3xl border border-slate-200 flex flex-col shadow-xl overflow-hidden relative z-10">
                            <div className="flex border-b border-slate-200 bg-slate-100 shadow-sm z-20 relative">
                                <div className="w-16 border-r border-slate-200 shrink-0 flex items-center justify-center bg-slate-200/50"><i className="fa-regular fa-clock text-slate-500 text-lg"></i></div>
                                {diasSemana.map(dia => (<div key={dia} className="flex-1 text-center py-4 font-black text-[13px] text-slate-600 uppercase tracking-widest border-r border-slate-200 last:border-0">{dia}</div>))}
                            </div>

                            <div className="flex-1 overflow-y-auto scroll-clean relative bg-slate-50">
                                <div className="relative w-full" style={{ height: `${TOTAL_HORAS * 60}px` }}>
                                    {/* Grillas de fondo */}
                                    <div className="absolute inset-0 flex">
                                        <div className="w-16 shrink-0 border-r border-slate-200 bg-slate-50 shadow-[2px_0_5px_rgba(0,0,0,0.02)] z-10"></div>
                                        {diasSemana.map((_, i) => (<div key={i} className="flex-1 border-r border-slate-200 last:border-0 grid-bg opacity-70"></div>))}
                                    </div>
                                    
                                    {/* Regla de Horas */}
                                    <div className="absolute top-0 left-0 w-16 text-center text-[11px] text-slate-400 font-bold z-10">
                                        {Array.from({length: TOTAL_HORAS + 1}).map((_, i) => (
                                            <div key={i} className="h-[60px] relative border-b border-transparent">
                                                <span className="absolute -top-2.5 left-0 w-full bg-slate-50 py-1">{String(i + HORA_INICIO).padStart(2, '0')}:00</span>
                                            </div>
                                        ))}
                                    </div>

                                    {/* RENDERIZADO DE CLASES EN EL HORARIO */}
                                    {seccionesAgregadas.map((seccion, sIdx) => {
                                        const colores = ['bg-blue-100 border-blue-500 text-blue-900', 'bg-emerald-100 border-emerald-500 text-emerald-900', 'bg-amber-100 border-amber-500 text-amber-900', 'bg-rose-100 border-rose-500 text-rose-900', 'bg-cyan-100 border-cyan-500 text-cyan-900'];
                                        const color = seccion.itemType === 'LAB' ? 'bg-purple-100 border-purple-500 text-purple-900 shadow-[0_0_12px_rgba(168,85,247,0.3)]' : colores[sIdx % colores.length];

                                        return seccion.horarios.map((horario, hIdx) => {
                                            const colIndex = diasSemana.indexOf(horario.dia);
                                            if (colIndex === -1) return null;
                                            const startMin = timeToMins(horario.inicio);
                                            const offsetTop = startMin - (HORA_INICIO * 60);
                                            const duration = timeToMins(horario.fin) - startMin;

                                            return (
                                                <div 
                                                    key={`${sIdx}-${hIdx}`}
                                                    className={`absolute class-block rounded-lg border-l-[5px] p-2 flex flex-col text-[11px] overflow-hidden hover:z-20 transition-all ${color}`}
                                                    style={{ top: `${offsetTop}px`, height: `${duration}px`, width: `calc((100% - 64px) / 6 - 8px)`, left: `calc(64px + ((100% - 64px) / 6) * ${colIndex} + 4px)` }}
                                                >
                                                    <span className="font-black leading-tight line-clamp-2 mb-1">{seccion.nombreCurso}</span>
                                                    {/* El profesor especifico de esa hora */}
                                                    <span className="font-bold text-[9px] opacity-70 truncate leading-tight mb-auto"><i className="fa-solid fa-user-tie"></i> {horario.docente}</span>
                                                    
                                                    <div className="mt-2 flex flex-col gap-1">
                                                        <span className="font-black opacity-80 bg-white/30 px-1 rounded w-max">{horario.inicio} - {horario.fin}</span>
                                                        <span className="font-black bg-white/60 px-1.5 py-0.5 rounded shadow-sm w-max">S:{seccion.seccion} | {horario.tipo}-{horario.aula}</span>
                                                    </div>
                                                </div>
                                            )
                                        });
                                    })}
                                </div>
                            </div>
                            
                            {seccionesAgregadas.length === 0 && (
                                <div className="absolute inset-0 flex flex-col items-center justify-center pointer-events-none opacity-40">
                                    <div className="w-40 h-40 bg-slate-200 rounded-full flex items-center justify-center mb-6 shadow-inner"><i className="fa-regular fa-calendar text-6xl text-slate-400"></i></div>
                                    <h2 className="text-3xl font-black text-slate-400 tracking-tight">Tu Horario está Vacío</h2>
                                    <p className="text-slate-500 font-medium text-center px-12 mt-3 text-lg">Busca en el catálogo y agrega tus secciones de <strong className="text-unac">Teoría/Práctica</strong> y paralelamente elige tus grupos de <strong className="text-purple-600">Laboratorio (90G, 91G...)</strong>.</p>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
