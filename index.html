                if (seccion.includes('G)') || seccion.includes('G(')) {
                    subSeccion = seccion;
                    seccion = col2Words.pop();
                    seccion = seccion + " " + subSeccion;
                }

                const planMatch = col2.match(/PLAN \d{4}\*? /);
                let docente = "POR DESIGNAR PROFESOR";
                if (planMatch) {
                    const planStr = planMatch[0];
                    const startDocente = col2.indexOf(planStr) + planStr.length;
                    const endDocente = col2.lastIndexOf(seccion.split(' ')[0]) - 1;
                    let docRaw = col2.substring(startDocente, endDocente).trim();
                    docRaw = docRaw.replace(/\s*-\s*\d+$/, '').trim();
                    if(docRaw) docente = docRaw;
                }

                const timeMatch = col3.match(/(\d{2}:\d{2})\s+a\s+(\d{2}:\d{2})/);
                if (!timeMatch) return;
                const inicio = timeMatch[1];
                const fin = timeMatch[2];

                const restCol3 = col3.substring(timeMatch[0].length).trim().split(' ');
                const tipoIndex = restCol3.findIndex(w => w === 'T' || w === 'P' || w === 'L');
                if (tipoIndex === -1) return;
                const tipo = restCol3[tipoIndex];
                
                let modalIndex = restCol3.findIndex(w => w === 'PRESENCIAL' || w === 'VIRTUAL');
                let aula = modalIndex > 0 ? restCol3.slice(0, modalIndex).join(' ') : "LAB";
                if (!aula) aula = "LAB";

                if (!courseMap[cursoNombre]) {
                    courseMap[cursoNombre] = { id: cursoNombre, nombre: cursoNombre, ciclo: ciclo, creditos: 4, seccionesBase: {} };
                }

                const baseSeccion = seccion.split(' ')[0];
                
                if (!courseMap[cursoNombre].seccionesBase[baseSeccion]) {
                    courseMap[cursoNombre].seccionesBase[baseSeccion] = {
                        id: `${cursoNombre}_${baseSeccion}`, seccion: baseSeccion, 
                        tp: [], labs: {}
                    };
                }

                const claseObj = { dia, inicio, fin, tipo, aula, docente };

                if (tipo === 'L' || seccion.includes('G')) {
                    if (!courseMap[cursoNombre].seccionesBase[baseSeccion].labs[seccion]) {
                        courseMap[cursoNombre].seccionesBase[baseSeccion].labs[seccion] = [];
                    }
                    courseMap[cursoNombre].seccionesBase[baseSeccion].labs[seccion].push(claseObj);
                } else {
                    courseMap[cursoNombre].seccionesBase[baseSeccion].tp.push(claseObj);
                }
            });

            return Object.values(courseMap);
        };

        const dbCursos = parseData();

        // === APLICACIÓN PRINCIPAL ===
        const App = () => {
            const [seccionesAgregadas, setSeccionesAgregadas] = useState([]);
            const [filtroCiclo, setFiltroCiclo] = useState('Todos');
            const [busqueda, setBusqueda] = useState('');
            const calendarRef = useRef(null);

            const timeToMins = (timeStr) => {
                if(!timeStr) return 0;
                const [h, m] = timeStr.split(':').map(Number);
                return (h * 60) + m;
            };

            const crucesCount = useMemo(() => {
                let cruces = 0;
                const bloques = [];
                seccionesAgregadas.forEach(sec => {
                    sec.horarios.forEach(hor => {
                        bloques.push({ dia: hor.dia, inicio: timeToMins(hor.inicio), fin: timeToMins(hor.fin) });
                    });
                });
                for(let i=0; i < bloques.length; i++){
                    for(let j=i+1; j < bloques.length; j++){
                        const b1 = bloques[i], b2 = bloques[j];
                        if(b1.dia === b2.dia && b1.inicio < b2.fin && b1.fin > b2.inicio) cruces++;
                    }
                }
                return cruces;
            }, [seccionesAgregadas]);

            const totalCreditos = useMemo(() => {
                const uniqueCursos = new Set();
                let total = 0;
                seccionesAgregadas.forEach(sec => {
                    if (!uniqueCursos.has(sec.cursoId)) { total += sec.creditos; uniqueCursos.add(sec.cursoId); }
                });
                return total;
            }, [seccionesAgregadas]);

            const cursosFiltrados = dbCursos.filter(c => {
                const matchCiclo = filtroCiclo === 'Todos' || c.ciclo === filtroCiclo;
                const searchTxt = busqueda.toLowerCase();
                const matchBus = c.nombre.toLowerCase().includes(searchTxt) || 
                                 Object.values(c.seccionesBase).some(b => 
                                     b.tp.some(h => h.docente.toLowerCase().includes(searchTxt)) ||
                                     Object.values(b.labs).some(labArr => labArr.some(h => h.docente.toLowerCase().includes(searchTxt)))
                                 );
                return matchCiclo && matchBus;
            });

            const toggleSeccion = (curso, itemID, nombreSeccion, horariosArray, itemType) => {
                const isAdded = seccionesAgregadas.some(s => s.id === itemID);
                if (isAdded) {
                    setSeccionesAgregadas(seccionesAgregadas.filter(s => s.id !== itemID));
                } else {
                    const clean = seccionesAgregadas.filter(s => {
                        if (s.cursoId !== curso.id) return true;
                        return s.itemType !== itemType; 
                    });
                    setSeccionesAgregadas([...clean, { 
                        id: itemID, cursoId: curso.id, nombreCurso: curso.nombre, 
                        seccion: nombreSeccion, horarios: horariosArray, itemType: itemType 
                    }]);
                }
            };

            const limpiarHorario = () => {
                if(confirm("¿Estás seguro de que quieres limpiar todo el horario?")) {
                    setSeccionesAgregadas([]);
                }
            };

            const exportarCalendario = () => {
                if(calendarRef.current) {
                    html2canvas(calendarRef.current, { scale: 2, backgroundColor: '#ffffff' }).then(canvas => {
                        const link = document.createElement('a');
                        link.download = 'Mi_Horario_CEET_FIQ.png';
                        link.href = canvas.toDataURL('image/png');
                        link.click();
                    });
                }
            };

            const diasSemana = ['Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];
            const HORA_INICIO = 8;
            const HORA_FIN = 23;
            const TOTAL_HORAS = HORA_FIN - HORA_INICIO;

            return (
                <div className="flex h-full w-full">
                    {/* BARRA LATERAL (Sidebar) Idéntica a la imagen */}
                    <aside className="w-64 bg-white border-r border-slate-200 flex flex-col items-center py-6 shadow-sm z-20 shrink-0 hidden md:flex h-full">
                        <div className="w-full px-5 flex flex-col items-center border-b border-slate-100 pb-6 mb-4">
                            {/* LOGO CEET - Si no encuentra la imagen local, mostrará texto */}
                            <img src="logo-ceet.png" alt="CEET FIQ" className="w-40 h-auto object-contain mb-3" 
                                 onError={(e) => {
                                     e.target.style.display='none';
                                     e.target.nextSibling.style.display='flex';
                                 }} 
                            />
                            <div className="hidden flex-col items-center text-center">
                                <i className="fa-solid fa-flask text-4xl text-unac mb-2"></i>
                                <h1 className="font-black text-xl text-slate-800 tracking-tight">CEET <span className="text-unac">FIQ</span></h1>
                            </div>
                            
                            <p className="text-[10px] text-slate-500 font-bold mt-2 text-center">FACULTAD DE INGENIERÍA QUÍMICA</p>
                            <span className="text-[9px] italic text-unac/70 mt-1 bg-unac/5 px-2 py-0.5 rounded-full text-center">"Crecemos juntos, aprendemos mejor"</span>
                        </div>

                        <nav className="w-full px-4 space-y-2 flex-1">
                            <a href="#" className="flex items-center gap-3 px-4 py-2.5 bg-ceet-green text-white rounded-xl font-bold shadow-md shadow-ceet-green/30 text-sm"><i className="fa-solid fa-calendar-days w-5 text-center"></i> Planificador</a>
                            <a href="#" className="flex items-center gap-3 px-4 py-2.5 text-slate-600 hover:bg-slate-100 rounded-xl font-semibold transition text-sm"><i className="fa-solid fa-clock-rotate-left w-5 text-center"></i> Mis Horarios</a>
                            <a href="#" className="flex items-center gap-3 px-4 py-2.5 text-slate-600 hover:bg-slate-100 rounded-xl font-semibold transition text-sm"><i className="fa-solid fa-book w-5 text-center"></i> Catálogo</a>
                            <a href="#" className="flex items-center gap-3 px-4 py-2.5 text-slate-600 hover:bg-slate-100 rounded-xl font-semibold transition text-sm"><i className="fa-solid fa-chart-simple w-5 text-center"></i> Estadísticas</a>
                        </nav>
                        
                        <div className="w-full px-4 mt-auto">
                            <a href="#" className="flex items-center gap-3 px-4 py-2.5 bg-slate-100 text-ceet-darkgreen hover:bg-slate-200 rounded-xl font-bold transition text-sm"><i className="fa-solid fa-gear w-5 text-center"></i> Ajustes</a>

                    {/* CONTENIDO PRINCIPAL (Derecha) */}

                        {/* Header Superior idéntico */}

                                <h2 className="text-xl font-black text-slate-800">Facultad de Ingeniería Química</h2>
                                <p className="text-sm font-bold text-ceet-green mt-1 flex items-center gap-2">
                                    CEET - Planificador de Horarios 2026-B 
                                    <span className="bg-ceet-green/10 text-ceet-darkgreen px-2 py-0.5 rounded text-[10px] uppercase tracking-wide italic">"De estudiantes para estudiantes"</span>
                                </p>
                            </div>
                            <div className="w-10 h-10 rounded-full border border-slate-200 flex items-center justify-center text-slate-500 hover:bg-slate-50 cursor-pointer shadow-sm">
                                <i className="fa-regular fa-bell"></i>
                            </div>
                        </div>

                        {/* ESTADÍSTICAS SUPERIORES (4 Tarjetas idénticas) */}
                        <div className="px-8 py-5 grid grid-cols-2 md:grid-cols-4 gap-4 shrink-0">
                            <div className="bg-white rounded-xl p-4 border border-slate-200 shadow-sm flex items-center gap-4">
                                <div className="w-10 h-10 rounded-full bg-ceet-green/10 text-ceet-green flex items-center justify-center text-lg"><i className="fa-solid fa-medal"></i></div>
                                <div><p className="text-2xl font-black text-slate-800">{totalCreditos} <span className="text-xs text-slate-400 font-medium">/ 26 máx.</span></p><p className="text-[10px] text-slate-500 font-bold uppercase">Créditos totales</p></div>
                            </div>
                            <div className="bg-white rounded-xl p-4 border border-slate-200 shadow-sm flex items-center gap-4">
                                <div className="w-10 h-10 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center text-lg"><i className="fa-solid fa-book-open"></i></div>
                                <div><p className="text-2xl font-black text-slate-800">{new Set(seccionesAgregadas.map(s=>s.cursoId)).size}</p><p className="text-[10px] text-slate-500 font-bold uppercase">Cursos matriculados</p></div>
                            </div>
                            <div className="bg-white rounded-xl p-4 border border-slate-200 shadow-sm flex items-center gap-4">
                                <div className={`w-10 h-10 rounded-full flex items-center justify-center text-lg ${crucesCount > 0 ? 'bg-red-100 text-red-600' : 'bg-emerald-100 text-emerald-600'}`}><i className="fa-solid fa-check-double"></i></div>
                                <div><p className={`text-2xl font-black ${crucesCount > 0 ? 'text-red-600' : 'text-slate-800'}`}>{crucesCount}</p><p className="text-[10px] text-slate-500 font-bold uppercase">Cruces de horario</p></div>
                            </div>
                            <div className="bg-white rounded-xl p-4 border border-slate-200 shadow-sm flex items-center gap-4">
                                <div className="w-10 h-10 rounded-full bg-orange-100 text-orange-600 flex items-center justify-center text-lg"><i className="fa-regular fa-clock"></i></div>
                                <div><p className="text-2xl font-black text-slate-800">-- h</p><p className="text-[10px] text-slate-500 font-bold uppercase">Horas semanales</p></div>
                            </div>
                        </div>

                        {/* ÁREA DE TRABAJO (Catálogo + Calendario) */}
                        <div className="px-8 flex items-start gap-6 mb-8">
                            
                            {/* CATÁLOGO (Izquierda) */}
                            <div className="w-1/3 min-w-[340px] max-w-[420px] bg-white rounded-2xl border border-slate-200 flex flex-col shadow-sm" style={{height: "800px"}}>
                                <div className="p-5 border-b border-slate-100">
                                    <h2 className="font-black text-lg text-slate-800 mb-4">Catálogo de Cursos</h2>
                                    <div className="space-y-3">
                                        <div className="relative">
                                            <i className="fa-solid fa-magnifying-glass absolute left-3 top-3 text-slate-400 text-sm"></i>
                                            <input type="text" placeholder="Buscar curso, código o docente... (/)" className="w-full pl-9 pr-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm font-medium focus:outline-none focus:border-ceet-green focus:bg-white transition-all" value={busqueda} onChange={(e) => setBusqueda(e.target.value)} />
                                        </div>
                                        <select className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm font-bold text-slate-600 focus:outline-none focus:border-ceet-green focus:bg-white cursor-pointer" value={filtroCiclo} onChange={(e) => setFiltroCiclo(e.target.value)}>
                                            <option value="Todos">Todos los ciclos</option>
                                            <option value="I">CICLO I</option><option value="II">CICLO II</option><option value="III">CICLO III</option><option value="IV">CICLO IV</option><option value="V">CICLO V</option><option value="VI">CICLO VI</option><option value="VII">CICLO VII</option><option value="VIII">CICLO VIII</option><option value="IX">CICLO IX</option><option value="X">CICLO X</option>
                                        </select>
                                    </div>
                                </div>
                                
                                <div className="flex-1 overflow-y-auto scroll-clean p-4 bg-white">
                                    {cursosFiltrados.length === 0 ? (
                                        <div className="text-center p-8 text-slate-400"><p className="font-medium text-sm">No se encontraron cursos</p></div>
                                    ) : (
                                        cursosFiltrados.map(curso => (
                                            <div key={curso.id} className="mb-6">
                                                {/* Header del Curso */}
                                                <div className="flex justify-between items-center mb-2">
                                                    <span className="font-black text-xs text-slate-700 tracking-wider">CICLO {curso.ciclo}</span>
                                                    <span className="text-[10px] text-slate-400 font-bold">{Object.keys(curso.seccionesBase).length} opciones <i className="fa-solid fa-chevron-up ml-1"></i></span>
                                                </div>
                                                
                                                <div className="bg-white border border-slate-200 rounded-xl overflow-hidden relative">
                                                    {/* Línea lateral de color */}
                                                    <div className="absolute left-0 top-0 bottom-0 w-1.5 bg-blue-600"></div>
                                                    
                                                    <div className="p-4 pl-5 border-b border-slate-100">
                                                        <h3 className="font-black text-xs uppercase text-slate-800 leading-tight mb-1">{curso.nombre}</h3>
                                                        <p className="text-[10px] text-slate-500 font-bold"><span className="bg-ceet-green/10 text-ceet-green px-1.5 py-0.5 rounded mr-1">C{curso.ciclo}</span> • {curso.creditos} Créditos - plan 2026</p>
                                                    </div>
                                                    
                                                    <div className="p-3 pl-4 space-y-3 bg-slate-50/30">
                                                        {Object.values(curso.seccionesBase).map(base => {
                                                            const hasTP = base.tp.length > 0;
                                                            const labs = Object.keys(base.labs);
                                                            const tpID = `${curso.id}_${base.seccion}_TP`;
                                                            const isTPAdded = seccionesAgregadas.some(s => s.id === tpID);

                                                            return (
                                                                <div key={base.id} className="space-y-3">
                                                                    
                                                                    {hasTP && (
                                                                        <div className={`border rounded-xl p-3 bg-white transition-all ${isTPAdded ? 'border-blue-400 shadow-md ring-1 ring-blue-400/50' : 'border-slate-200 hover:border-slate-300'}`}>
                                                                            <div className="flex justify-between items-center mb-3">
                                                                                <div className="flex items-center gap-2">
                                                                                    <h4 className="font-black text-xs text-slate-700 bg-slate-100 px-2 py-1 rounded">SECCIÓN {base.seccion} (T/P)</h4>
                                                                                </div>
                                                                                <button onClick={() => toggleSeccion(curso, tpID, base.seccion, base.tp, 'TP')} className={`w-7 h-7 rounded-md flex items-center justify-center text-xs transition-all ${isTPAdded ? 'bg-blue-600 text-white shadow-md' : 'bg-slate-100 text-slate-500 hover:bg-blue-600 hover:text-white'}`}>
                                                                                    <i className={`fa-solid ${isTPAdded ? 'fa-minus' : 'fa-plus'}`}></i>
                                                                                </button>
                                                                            </div>
                                                                            
                                                                            <div className="space-y-2">
                                                                                {base.tp.map((h, i) => (
                                                                                    <div key={i} className="flex justify-between items-center text-[10px]">
                                                                                        <span className="font-black text-slate-700 w-6">{h.dia}</span>
                                                                                        <span className="text-slate-500 font-semibold">{h.inicio} a {h.fin}</span>
                                                                                        <span className="font-black bg-slate-100 px-1.5 py-0.5 rounded text-slate-600">{h.aula}</span>
                                                                                        <span className="text-[9px] font-bold text-slate-400 w-24 truncate text-right" title={h.docente}>{h.docente.split(' ')[0]} {h.docente.split(' ')[1]}</span>
                                                                                    </div>
                                                                                ))}
                                                                            </div>
                                                                        </div>
                                                                    )}

                                                                    {labs.length > 0 && (
                                                                        <div className="pl-2 border-l-2 border-slate-200 space-y-2">
                                                                            {labs.map(labSec => {
                                                                                const labHorarios = base.labs[labSec];
                                                                                const labID = `${curso.id}_${labSec}_LAB`;
                                                                                const isLabAdded = seccionesAgregadas.some(s => s.id === labID);

                                                                                return (
                                                                                    <div key={labSec} className={`border rounded-xl p-2.5 bg-white transition-all ${isLabAdded ? 'border-purple-400 shadow-sm ring-1 ring-purple-400/50' : 'border-slate-200'}`}>
                                                                                        <div className="flex justify-between items-center mb-2">
                                                                                            <h4 className="font-black text-[11px] text-purple-700 bg-purple-50 px-2 py-0.5 rounded">SEC {labSec} LAB</h4>
                                                                                            <button onClick={() => toggleSeccion(curso, labID, labSec, labHorarios, 'LAB')} className={`w-6 h-6 rounded-md flex items-center justify-center text-[10px] transition-all ${isLabAdded ? 'bg-purple-600 text-white' : 'bg-slate-100 text-slate-500 hover:bg-purple-600 hover:text-white'}`}>
                                                                                                <i className={`fa-solid ${isLabAdded ? 'fa-minus' : 'fa-plus'}`}></i>
                                                                                            </button>
                                                                                        </div>
                                                                                        <div className="space-y-1.5">
                                                                                            {labHorarios.map((h, i) => (
                                                                                                <div key={i} className="flex justify-between items-center text-[10px]">
                                                                                                    <span className="font-black text-slate-700 w-6">{h.dia}</span>
                                                                                                    <span className="text-slate-500 font-semibold">{h.inicio} a {h.fin}</span>
                                                                                                    <span className="font-black bg-purple-50 px-1.5 py-0.5 rounded text-purple-700">{h.aula}</span>
                                                                                                </div>
                                                                                            ))}
                                                                                        </div>
                                                                                    </div>
                                                                                )
                                                                            })}
                                                                        </div>
                                                                    )}
                                                                </div>
                                                            )
                                                        })}
                                                    </div>
                                                </div>
                                            </div>
                                        ))
                                    )}
                                </div>
                            </div>

                            {/* CALENDARIO (Derecha) */}
                            <div className="flex-1 bg-white rounded-2xl border border-slate-200 flex flex-col shadow-sm overflow-hidden relative" style={{height: "800px"}}>
                                {/* Cabecera del Calendario */}
                                <div className="flex justify-between items-center px-6 py-4 border-b border-slate-100 bg-white z-20 shadow-sm">
                                    <h2 className="font-black text-slate-800 text-lg flex items-center gap-2">
                                        <i className="fa-regular fa-calendar-check text-ceet-green"></i> Mi Horario <span className="bg-slate-100 text-slate-500 text-xs px-2 py-1 rounded ml-2 font-bold">Horario Semanal</span>
                                    </h2>
                                    <div className="flex items-center gap-2">
                                        <button onClick={limpiarHorario} className="text-slate-400 hover:text-red-500 bg-slate-50 hover:bg-red-50 px-3 py-1.5 rounded-lg text-xs font-bold border border-slate-200 transition-all" title="Limpiar Horario">
                                            <i className="fa-solid fa-trash-can mr-1"></i> Limpiar
                                        </button>
                                        <button onClick={exportarCalendario} className="text-white bg-ceet-green hover:bg-ceet-darkgreen px-3 py-1.5 rounded-lg text-xs font-bold shadow-sm transition-all" title="Descargar como Imagen">
                                            <i className="fa-solid fa-download mr-1"></i> Exportar
                                        </button>
                                    </div>
                                </div>

                                {/* Grilla del Calendario (Ref asignada para exportar) */}
                                <div className="flex flex-col flex-1 relative bg-white" ref={calendarRef} id="calendario-exportar">
                                    {/* Días Top */}
                                    <div className="flex border-b border-slate-200 bg-slate-50 z-10 sticky top-0">
                                        <div className="w-16 border-r border-slate-200 shrink-0 flex items-center justify-center font-bold text-xs text-slate-500">HORA</div>
                                        {diasSemana.map(dia => (<div key={dia} className="flex-1 text-center py-3 font-black text-xs text-slate-800 uppercase tracking-widest border-r border-slate-200 last:border-0">{dia}</div>))}
                                    </div>

                                    <div className="flex-1 overflow-y-auto scroll-clean relative bg-white">
                                        <div className="relative w-full" style={{ height: `${TOTAL_HORAS * 60}px` }}>
                                            <div className="absolute inset-0 flex">
                                                <div className="w-16 shrink-0 border-r border-slate-200 bg-slate-50 z-10"></div>
                                                {diasSemana.map((_, i) => (<div key={i} className="flex-1 border-r border-slate-100 last:border-0 grid-bg"></div>))}
                                            </div>
                                            
                                            <div className="absolute top-0 left-0 w-16 text-center text-[10px] text-slate-500 font-bold z-10">
                                                {Array.from({length: TOTAL_HORAS + 1}).map((_, i) => (
                                                    <div key={i} className="h-[60px] relative border-b border-slate-100">
                                                        <span className="absolute -top-2 left-0 w-full bg-slate-50"><span className="text-slate-700 font-black">{String(i + HORA_INICIO).padStart(2, '0')}</span>:00</span>
                                                    </div>
                                                ))}
                                            </div>

                                            {/* BLOQUES RENDERIZADOS */}
                                            {seccionesAgregadas.map((seccion, sIdx) => {
                                                const colores = ['bg-blue-100 border-blue-500 text-blue-900', 'bg-emerald-100 border-emerald-500 text-emerald-900', 'bg-orange-100 border-orange-500 text-orange-900', 'bg-rose-100 border-rose-500 text-rose-900', 'bg-cyan-100 border-cyan-500 text-cyan-900'];

                                                return seccion.horarios.map((horario, hIdx) => {
                                                    const colIndex = diasSemana.indexOf(horario.dia);
                                                    if (colIndex === -1) return null;
                                                    const startMin = timeToMins(horario.inicio);
                                                    const offsetTop = startMin - (HORA_INICIO * 60);
                                                    const duration = timeToMins(horario.fin) - startMin;

                                                    return (
                                                        <div 
                                                            key={`${sIdx}-${hIdx}`}
                                                            className={`absolute class-block rounded-md border-l-[4px] p-2 flex flex-col text-[10px] overflow-hidden z-20 ${color}`}
                                                            style={{ top: `${offsetTop}px`, height: `${duration}px`, width: `calc((100% - 64px) / 6 - 8px)`, left: `calc(64px + ((100% - 64px) / 6) * ${colIndex} + 4px)` }}
                                                        >
                                                            <span className="font-black leading-tight line-clamp-2 mb-1">{seccion.nombreCurso}</span>
                                                            <span className="font-bold text-[9px] opacity-75 truncate mb-auto"><i className="fa-solid fa-user-tie"></i> {horario.docente.split(' ').slice(0,2).join(' ')}</span>
                                                            
                                                            <div className="mt-1 flex flex-col gap-0.5">
                                                                <span className="font-black bg-white/40 px-1 py-0.5 rounded w-max shadow-sm">S:{seccion.seccion} | {horario.tipo}-{horario.aula}</span>
                                                            </div>
                                                        </div>
                                                    )
                                                });
                                            })}
                                        </div>
                                    </div>
                                    
                                    {seccionesAgregadas.length === 0 && (
                                        <div className="absolute inset-0 flex flex-col items-center justify-center pointer-events-none opacity-90 z-30 bg-white/60 backdrop-blur-[1px]">
                                            <div className="bg-white p-6 rounded-2xl shadow-xl border border-slate-100 flex flex-col items-center text-center max-w-sm">
                                                <div className="w-16 h-16 bg-ceet-green/10 rounded-full flex items-center justify-center mb-4"><i className="fa-regular fa-calendar-check text-3xl text-ceet-green"></i></div>
                                                <h3 className="text-xl font-black text-slate-800 mb-2">Arma tu horario ideal</h3>
                                                <p className="text-sm text-slate-500 mb-4 font-medium">Haz clic en cualquier curso del catálogo a la izquierda para comenzar a armar tu horario semanal.</p>
                                                <button className="bg-blue-600 text-white font-bold py-2 px-6 rounded-lg text-sm shadow-md pointer-events-auto"><i className="fa-solid fa-magnifying-glass mr-2"></i>Buscar cursos en el catálogo</button>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>

                        {/* PANELES INFERIORES: Cursos Seleccionados y Horarios Guardados */}
                        <div className="px-8 pb-8 flex gap-6 mt-4">
                            <div className="flex-1 bg-white rounded-2xl border border-slate-200 p-6 shadow-sm min-h-[150px] flex flex-col">
                                <h3 className="font-black text-slate-800 text-base mb-4 border-b border-slate-100 pb-2">Cursos Seleccionados</h3>
                                {seccionesAgregadas.length === 0 ? (
                                    <div className="flex-1 flex items-center justify-center text-sm font-medium text-slate-400 italic">Aún no has seleccionado ningún curso.</div>
                                ) : (
                                    <div className="flex flex-wrap gap-2">
                                        {seccionesAgregadas.map(s => (
                                            <span key={s.id} className="bg-slate-100 border border-slate-200 text-slate-700 text-xs font-bold px-3 py-1.5 rounded-lg flex items-center gap-2">
                                                {s.nombreCurso} ({s.seccion})
                                                <i className="fa-solid fa-xmark text-slate-400 hover:text-red-500 cursor-pointer" onClick={() => setSeccionesAgregadas(seccionesAgregadas.filter(x => x.id !== s.id))}></i>
                                            </span>
                                        ))}
                                    </div>
                                )}
                            </div>
                            <div className="flex-1 bg-white rounded-2xl border border-slate-200 p-6 shadow-sm min-h-[150px] flex flex-col">
                                <h3 className="font-black text-slate-800 text-base mb-4 border-b border-slate-100 pb-2">Horarios Guardados</h3>
                                <div className="flex-1 flex items-center justify-center text-sm font-medium text-slate-400 italic">
                                    Aún no has guardado ningún horario.
                                </div>
                            </div>
                        </div>

                        {/* FOOTER VERDE/CEET - Redes Sociales */}
                        <div className="bg-ceet-darkgreen w-full py-8 border-t-4 border-gold mt-auto flex flex-col items-center">
                            <h2 className="text-white font-black text-lg tracking-widest uppercase mb-1">Integración Estudiantil</h2>
                            <p className="text-gold-light text-xs font-bold italic tracking-wider mb-6">"De estudiantes para estudiantes"</p>
                            
                            <p className="text-white font-bold text-sm mb-4">Síguenos en nuestras redes sociales</p>
                            <div className="flex flex-wrap gap-4 justify-center">
                                <a href="#" className="bg-white text-ceet-darkgreen hover:bg-slate-100 font-bold px-4 py-2 rounded-full text-xs flex items-center gap-2 shadow-lg transition-transform hover:scale-105"><i className="fa-brands fa-instagram text-lg text-pink-600"></i> @integracionestudiantil</a>
                                <a href="#" className="bg-white text-ceet-darkgreen hover:bg-slate-100 font-bold px-4 py-2 rounded-full text-xs flex items-center gap-2 shadow-lg transition-transform hover:scale-105"><i className="fa-brands fa-facebook text-lg text-blue-600"></i> Facebook</a>
                                <a href="#" className="bg-white text-ceet-darkgreen hover:bg-slate-100 font-bold px-4 py-2 rounded-full text-xs flex items-center gap-2 shadow-lg transition-transform hover:scale-105"><i className="fa-brands fa-tiktok text-lg text-black"></i> @integracion.estudiantil</a>
                                <a href="#" className="bg-white text-ceet-darkgreen hover:bg-slate-100 font-bold px-4 py-2 rounded-full text-xs flex items-center gap-2 shadow-lg transition-transform hover:scale-105"><i className="fa-brands fa-whatsapp text-lg text-green-500"></i> Canal de WhatsApp</a>
                            </div>
                        </div>

                        {/* FOOTER 3D GLOBE */}
                        <div className="footer-dark w-full flex flex-col items-center justify-center">
                            <div className="globe-container">
                                <div className="globe">
                                    <div className="ring"></div><div className="ring"></div><div className="ring"></div>
                                    <div className="ring"></div><div className="ring"></div><div className="ring"></div>
                                    <div className="ring"></div>
                                </div>
                            </div>
                            <div className="creator-text">S I S T E M A  C R E A D O  P O R  S E B A S T I A N</div>
                            <div className="copyright-text">© 2026 UNAC - CEET FIQ. TODOS LOS DERECHOS RESERVADOS.</div>
                        </div>

                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
