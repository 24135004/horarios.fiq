        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

        /* FOOTER HIGH-TECH 3D */

            background: radial-gradient(circle at bottom, #001a38 0%, #00040a 100%);
            border-top: 1px solid rgba(0, 162, 255, 0.2);
            position: relative; overflow: hidden; padding: 60px 20px 40px; margin-top: auto;
            box-shadow: 0 -10px 40px rgba(0, 100, 255, 0.1);

        .tech-footer::before {
            content: ''; position: absolute; inset: 0;
            background-image: 
                linear-gradient(rgba(0, 162, 255, 0.05) 1px, transparent 1px),

        .tech-globe { width: 100%; height: 100%; transform-style: preserve-3d; animation: spinTech 12s linear infinite; }
        .tech-ring {
            position: absolute; width: 100%; height: 100%; border-radius: 50%;

        }
        .tech-ring:nth-child(1) { transform: rotateY(0deg); }
        .tech-ring:nth-child(2) { transform: rotateY(36deg); }
        .tech-ring:nth-child(3) { transform: rotateY(72deg); }
        .tech-ring:nth-child(4) { transform: rotateY(108deg); }
        .tech-ring:nth-child(5) { transform: rotateY(144deg); }
        .tech-ring:nth-child(6) { transform: rotateX(90deg); border-color: rgba(212, 175, 55, 0.8); box-shadow: 0 0 20px rgba(212, 175, 55, 0.5) inset, 0 0 20px rgba(212, 175, 55, 0.5); }
        .tech-core {
            position: absolute; top: 50%; left: 50%; width: 20px; height: 20px;
            background: #00c3ff; border-radius: 50%; transform: translate(-50%, -50%);
            box-shadow: 0 0 40px 10px #00c3ff; opacity: 0.8;
        }
        @keyframes spinTech { 0% { transform: rotateX(20deg) rotateY(0deg); } 100% { transform: rotateX(20deg) rotateY(360deg); } }
        
        .neon-creator {
            font-weight: 900; letter-spacing: 0.4em; font-size: 1rem; text-align: center; margin-bottom: 8px; z-index: 10; position: relative;

<body class="flex h-screen w-full bg-[#002855]">
    <div id="root" class="w-full h-full"></div>

    <script type="text/babel">
        const { useState, useMemo, useRef } = React;

        // === DATOS CRUDOS DE CURSOS I al X (Reducidos para código, la lógica está intacta) ===
        // NOTA: Contiene los datos que procesaste anteriormente
        const rawTableData = `
I	ESTADO, SOCIEDAD, CULTURA Y DESARROLLO HUMANO - IEGH06 PLAN 2026 RODRIGUEZ TARANCO OSCAR JUAN - 2425 01Q Lun	08:00 a 10:30 FIQ1A03 PRESENCIAL T 90 Completado CALLAO
I	ESTADO, SOCIEDAD, CULTURA Y DESARROLLO HUMANO - IEGH06 PLAN 2026 RODRIGUEZ TARANCO OSCAR JUAN - 2425 02Q Mar	10:30 a 13:00 FIQ1A03 PRESENCIAL T 90 Completado CALLAO
I	MATEMÁTICA BÁSICA - IEGM02 PLAN 2026 REYNA SEGURA ANA MARIA - 1212 01Q Mar	08:00 a 10:30 FIQ3A06 PRESENCIAL T 40 Completado CALLAO
I	MATEMÁTICA BÁSICA - IEGM02 PLAN 2026 REYNA SEGURA ANA MARIA - 1212 01Q Jue	08:00 a 10:30 FIQ4A12 PRESENCIAL P 40 Completado CALLAO
I	MATEMÁTICA I - IEGM01 PLAN 2026 RODRIGUEZ CHUQUIMANGO SANTOS PANTALEON - 2359 01Q Mié	08:00 a 10:30 FIQ3A06 PRESENCIAL T 40 Completado CALLAO
I	MATEMÁTICA I - IEGM01 PLAN 2026 RODRIGUEZ CHUQUIMANGO SANTOS PANTALEON - 2359 01Q Vie	10:30 a 13:00 FIQ3A06 PRESENCIAL P 40 Completado CALLAO
I	QUÍMICA GENERAL I - IEGQ03 PLAN 2026 REYNA MENDOZA GLADIS ENITH - 2697 01Q Mié	10:30 a 12:10 FIQ3A06 PRESENCIAL T 40 Completado CALLAO
I	QUÍMICA GENERAL I - IEGQ03 PLAN 2026 REYNA MENDOZA GLADIS ENITH - 2697 01Q Vie	08:00 a 10:30 FIQ3A06 PRESENCIAL P 40 Completado CALLAO
I	QUÍMICA GENERAL I - IEGQ03 PLAN 2026 HERRERA SANCHEZ SONIA ELIZABETH - 1488 01Q (90G) Lun	10:30 a 13:00 SL01LA77 PRESENCIAL L 20 Completado CALLAO
II	FÍSICA I - IEGF09 PLAN 2023 MONTERO ARTEAGA WIMPPER DANIEL - 1062 01Q Vie	09:40 a 12:10 FIQ4A11 PRESENCIAL T 40 Completado CALLAO
II	FÍSICA I - IEGF09 PLAN 2023 MONTERO ARTEAGA WIMPPER DANIEL - 1062 01Q Jue	08:00 a 09:40 FIQ4A11 PRESENCIAL P 40 Completado CALLAO
II	FÍSICA I - IEGF09 PLAN 2023 MONTERO ARTEAGA WIMPPER DANIEL - 1062 01Q (90G) Mié	13:00 a 14:40 SL01LA76 PRESENCIAL L 20 Completado CALLAO
III	FÍSICA II - IEGF13 PLAN 2023 CABRERA ARISTA CESAR - 2910 01Q Lun	12:10 a 13:50 FIQ4A11 PRESENCIAL T 40 Completado CALLAO
III	FÍSICA II - IEGF13 PLAN 2023 CABRERA ARISTA CESAR - 2910 01Q (90G) Vie	10:30 a 12:10 SL01LA76 PRESENCIAL L 20 Completado CALLAO
IV	FISICOQUÍMICA I - IEEP20 PLAN 2023 PANTOJA CADILLO AGERICO - 1525 01Q Mar	08:00 a 09:40 FIQ4A10 PRESENCIAL T 40 Completado CALLAO
IV	FISICOQUÍMICA I - IEEP20 PLAN 2023 DIAZ GUTIERREZ ALBERTINA - 0761 01Q (90G) Jue	09:40 a 12:10 SL01LA74 PRESENCIAL L 20 Completado CALLAO
V	BALANCE DE MATERIA Y ENERGÍA - IEEP24 PLAN 2023 POR DESIGNAR PROFESOR - 0000 01Q Mié	11:20 a 13:50 FIQ4A10 PRESENCIAL T 40 Completado CALLAO
VI	ANÁLISIS INSTRUMENTAL - IEET28 PLAN 2023 RODRIGUEZ VILCHEZ RICARDO - 0128 01Q Lun	08:00 a 10:30 FIQ2A04 PRESENCIAL T 57 Completado CALLAO
VII	MECÁNICA DE FLUIDOS - IEEP35 PLAN 2023 LOPEZ HERRERA JORGE AMADOR - 7007 01Q Lun	16:20 a 18:50 FIQ2A02 PRESENCIAL T 63 Completado CALLAO
VIII	INGENIERÍA DE LAS REACCIONES QUÍMICAS I - IEEP43 PLAN 2023 DIAZ BRAVO PABLO BELIZARIO - 0902 01Q Lun	13:50 a 16:20 FIQ1A01 PRESENCIAL T 90 Completado CALLAO
IX	METALURGIA II - IESP59 PLAN 2019* CUBA TORRE HECTOR RICARDO - 1957 01Q Vie	11:20 a 13:00 FIQ4A10 PRESENCIAL T 40 Completado CALLAO
X	DISEÑO DE PLANTAS - IFPR62 PLAN 2019* MACHACA GONZALES LEONARDO FELIX - 0417 01Q Lun	16:20 a 18:50 FIQ2A04 PRESENCIAL T 80 Completado CALLAO`;

        // Parser
        const parseData = () => {
            const lines = rawTableData.trim().split('\n');
            const courseMap = {};

            lines.forEach(line => {
                const parts = line.split('\t');
                if (parts.length < 3) return;
                const ciclo = parts[0].trim();
                const col2 = parts[1].trim(); 
                const col3 = parts[2].trim(); 

                const planIndex = col2.indexOf(" PLAN ");
                if (planIndex === -1) return;
                const cursoNombreCompleto = col2.substring(0, planIndex).trim();
                
                const codeMatch = cursoNombreCompleto.match(/-\s*([A-Z0-9]+)$/);
                const codigo = codeMatch ? codeMatch[1] : "FIQ";
                const cursoNombre = cursoNombreCompleto.replace(/-\s*[A-Z0-9]+$/, '').trim();

                const col2Words = col2.split(' ');
                const dia = col2Words.pop();
                let seccion = col2Words.pop();
                let subSeccion = "";
                if (seccion.includes('G)') || seccion.includes('G(')) {
                    subSeccion = seccion; seccion = col2Words.pop() + " " + subSeccion;
                }

                const planMatch = col2.match(/PLAN \d{4}\*? /);
                let docente = "POR DESIGNAR";
                if (planMatch) {
                    const docRaw = col2.substring(col2.indexOf(planMatch[0]) + planMatch[0].length, col2.lastIndexOf(seccion.split(' ')[0]) - 1).trim();
                    docente = docRaw.replace(/\s*-\s*\d+$/, '').trim() || docente;
                }

                const timeMatch = col3.match(/(\d{2}:\d{2})\s+a\s+(\d{2}:\d{2})/);
                if (!timeMatch) return;
                const [inicio, fin] = [timeMatch[1], timeMatch[2]];

                const restCol3 = col3.substring(timeMatch[0].length).trim().split(' ');
                let tipo = "T", cupos = "40";
                const tipoIndex = restCol3.findIndex(w => ['T','P','L'].includes(w));
                if (tipoIndex !== -1) { tipo = restCol3[tipoIndex]; cupos = restCol3[tipoIndex + 1] || "40"; }
                
                let modalIndex = restCol3.findIndex(w => w === 'PRESENCIAL' || w === 'VIRTUAL');
                let aula = modalIndex > 0 ? restCol3.slice(0, modalIndex).join(' ') : "LAB";

                if (!courseMap[cursoNombre]) courseMap[cursoNombre] = { id: cursoNombre, nombre: cursoNombre, codigo, ciclo, creditos: Math.floor(Math.random()*2)+3, seccionesBase: {} }; // Creditos 3 o 4 simulados
                
                const baseSeccion = seccion.split(' ')[0];
                if (!courseMap[cursoNombre].seccionesBase[baseSeccion]) courseMap[cursoNombre].seccionesBase[baseSeccion] = { id: `${cursoNombre}_${baseSeccion}`, seccion: baseSeccion, tp: [], labs: {} };

                const claseObj = { dia, inicio, fin, tipo, aula, docente, cupos };
                if (tipo === 'L' || seccion.includes('G')) {
                    if (!courseMap[cursoNombre].seccionesBase[baseSeccion].labs[seccion]) courseMap[cursoNombre].seccionesBase[baseSeccion].labs[seccion] = [];
                    courseMap[cursoNombre].seccionesBase[baseSeccion].labs[seccion].push(claseObj);
                } else {
                    courseMap[cursoNombre].seccionesBase[baseSeccion].tp.push(claseObj);
                }
            });
            return Object.values(courseMap);
        };

        const dbCursos = parseData();
        const borderColors = ['border-blue-500', 'border-emerald-500', 'border-purple-500', 'border-orange-500', 'border-pink-500'];

        // COMPONENTE PRINCIPAL
        const App = () => {
            const [seccionesAgregadas, setSeccionesAgregadas] = useState([]);
            const [filtroCiclo, setFiltroCiclo] = useState('Todos');
            const [busqueda, setBusqueda] = useState('');
            const [activeModal, setActiveModal] = useState('none'); // 'none', 'download', 'stats', 'saved', 'settings'
            
            const calendarRef = useRef(null);

            const timeToMins = (t) => { const [h,m]=t.split(':').map(Number); return h*60+m; };

            const { crucesCount, totalCreditos, totalHoras } = useMemo(() => {
                let cruces = 0; let totalMins = 0; const bloques = [];
                const uniqueCursos = new Set(); let creds = 0;
                
                seccionesAgregadas.forEach(sec => {
                    if (!uniqueCursos.has(sec.cursoId)) { creds += sec.creditos; uniqueCursos.add(sec.cursoId); }
                    sec.horarios.forEach(hor => {
                        const ini = timeToMins(hor.inicio); const fin = timeToMins(hor.fin);
                        totalMins += (fin - ini);
                        bloques.push({ dia: hor.dia, inicio: ini, fin: fin });
                    });
                });
                
                for(let i=0; i<bloques.length; i++){
                    for(let j=i+1; j<bloques.length; j++){
                        if(bloques[i].dia === bloques[j].dia && bloques[i].inicio < bloques[j].fin && bloques[i].fin > bloques[j].inicio) cruces++;
                    }
                }
                return { crucesCount: cruces, totalCreditos: creds, totalHoras: Math.floor(totalMins/60) };
            }, [seccionesAgregadas]);

            const cursosFiltrados = dbCursos.filter(c => {
                if (filtroCiclo !== 'Todos' && c.ciclo !== filtroCiclo) return false;
                const txt = busqueda.toLowerCase();
                return c.nombre.toLowerCase().includes(txt) || Object.values(c.seccionesBase).some(b => b.tp.some(h=>h.docente.toLowerCase().includes(txt)) || Object.values(b.labs).some(l=>l.some(h=>h.docente.toLowerCase().includes(txt))));
            });

            const cursosPorCiclo = useMemo(() => cursosFiltrados.reduce((acc, c) => { (acc[c.ciclo] = acc[c.ciclo]||[]).push(c); return acc; }, {}), [cursosFiltrados]);

            const toggleSeccion = (curso, itemID, nombreSeccion, horarios, itemType) => {
                if (seccionesAgregadas.some(s => s.id === itemID)) setSeccionesAgregadas(seccionesAgregadas.filter(s => s.id !== itemID));
                else setSeccionesAgregadas([...seccionesAgregadas.filter(s => !(s.cursoId === curso.id && s.itemType === itemType)), { id: itemID, cursoId: curso.id, nombreCurso: curso.nombre, seccion: nombreSeccion, horarios, itemType, creditos: curso.creditos }]);
            };

            const exportarPNG = () => {
                html2canvas(calendarRef.current, { scale: 2 }).then(canvas => {
                    const l = document.createElement('a'); l.download = 'Mi_Horario_CEET.png'; l.href = canvas.toDataURL(); l.click();
                    setActiveModal('none');
                });
            };
            const exportarPDF = () => {
                html2canvas(calendarRef.current, { scale: 2 }).then(canvas => {
                    const pdf = new window.jspdf.jsPDF('l', 'mm', 'a4');
                    pdf.addImage(canvas.toDataURL('image/png'), 'PNG', 0, 0, pdf.internal.pageSize.getWidth(), (canvas.height * pdf.internal.pageSize.getWidth()) / canvas.width);
                    pdf.save('Mi_Horario_CEET.pdf');
                    setActiveModal('none');
                });
            };

            const diasSemana = ['Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];
            const HORA_INICIO = 8, HORA_FIN = 23, TOTAL_HORAS = HORA_FIN - HORA_INICIO;

            // RENDER MODALES
            const renderModal = () => {
                if(activeModal === 'none') return null;
                
                return (
                    <div className="fixed inset-0 z-50 flex items-center justify-center modal-overlay bg-black/40">
                        <div className="bg-white rounded-2xl shadow-2xl w-[90%] max-w-4xl max-h-[90vh] flex flex-col modal-content overflow-hidden relative">
                            {/* Cabecera Modal */}
                            <div className="flex justify-between items-center px-6 py-4 border-b border-slate-100 bg-slate-50">
                                <h2 className="text-xl font-black text-slate-800 flex items-center gap-2">
                                    {activeModal === 'download' && <><i className="fa-solid fa-wand-magic-sparkles text-purple-500"></i> Galería de Diseños UNAC</>}
                                    {activeModal === 'stats' && <><i className="fa-solid fa-chart-column text-blue-500"></i> Estadísticas del Horario</>}
                                    {activeModal === 'saved' && <><i className="fa-solid fa-folder-open text-emerald-500"></i> Mis Horarios Guardados</>}
                                    {activeModal === 'settings' && <><i className="fa-solid fa-gear text-slate-500"></i> Ajustes Avanzados del Sistema</>}
                                </h2>
                                <button onClick={()=>setActiveModal('none')} className="w-8 h-8 rounded-full bg-slate-200 hover:bg-red-100 hover:text-red-500 transition-colors flex items-center justify-center text-slate-600"><i className="fa-solid fa-xmark"></i></button>
                            </div>
                            
                            {/* Contenido Modal */}
                            <div className="p-6 overflow-y-auto bg-white flex-1">
                                {activeModal === 'download' && (
                                    <div className="space-y-6">
                                        <p className="text-sm text-slate-500">Selecciona tu plantilla favorita y descárgala en formato PNG, PDF o Excel.</p>
                                        <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                            {/* Tarjetas de Diseño Simulado */}
                                            <div className="border-2 border-[#5c4cfc] rounded-xl p-4 cursor-pointer relative bg-blue-50/30">
                                                <div className="absolute top-3 right-3 bg-[#5c4cfc] text-white w-6 h-6 rounded-full flex items-center justify-center"><i className="fa-solid fa-check text-xs"></i></div>
                                                <span className="bg-amber-100 text-amber-700 text-[10px] font-bold px-2 py-1 rounded uppercase tracking-wider"><i className="fa-solid fa-star mr-1"></i> Pantalla</span>
                                                <h3 className="font-bold text-slate-800 mt-3 mb-1">Mi Horario Actual</h3>
                                                <p className="text-xs text-slate-500">Exporta el horario exactamente como se visualiza en pantalla, con tu paleta de colores activa y badges interactivos.</p>
                                            </div>
                                            <div className="border border-slate-200 rounded-xl p-4 cursor-pointer hover:border-slate-300">
                                                <span className="bg-emerald-100 text-emerald-700 text-[10px] font-bold px-2 py-1 rounded uppercase tracking-wider">Paleta</span>
                                                <h3 className="font-bold text-slate-800 mt-3 mb-1">Tonos Suaves (Clásico)</h3>
                                                <p className="text-xs text-slate-500">Paleta clásica de tonos suaves verde, azul, amarillo y rosa de contraste armónico.</p>
                                            </div>
                                            <div className="border border-slate-200 rounded-xl p-4 cursor-pointer hover:border-slate-300">
                                                <span className="bg-slate-800 text-white text-[10px] font-bold px-2 py-1 rounded uppercase tracking-wider">Formal</span>
                                                <h3 className="font-bold text-slate-800 mt-3 mb-1">Institucional UNAC</h3>
                                                <p className="text-xs text-slate-500">Azul marino institucional, membrete académico oficial, bordes limpios y membrete de la Universidad del Callao.</p>
                                            </div>
                                        </div>
                                        
                                        <div className="mt-6 border border-slate-200 rounded-xl bg-slate-50 p-4">
                                            <div className="flex justify-between items-center mb-3">
                                                <h4 className="font-bold text-sm text-slate-700"><i className="fa-regular fa-eye mr-2"></i>Vista Previa Real</h4>
                                            </div>
                                            <div className="w-full h-48 bg-white border border-slate-200 rounded-lg shadow-sm flex items-center justify-center opacity-70 overflow-hidden pointer-events-none">
                                                {/* Mini representación del horario actual */}
                                                <div className="scale-[0.4] origin-center w-full h-full pointer-events-none" dangerouslySetInnerHTML={{__html: document.getElementById('calendario-exportar')?.outerHTML || '<p>Cargando vista...</p>'}}></div>
                                            </div>
                                        </div>
                                    </div>
                                )}

                                {activeModal === 'stats' && (
                                    <div className="grid grid-cols-2 gap-4">
                                        <div className="bg-blue-50 border border-blue-100 rounded-xl p-5">
                                            <p className="text-xs font-bold text-slate-500 uppercase tracking-wide">Créditos Inscritos</p>
                                            <p className="text-3xl font-black text-[#5c4cfc] mt-1">{totalCreditos} Cr.</p>
                                        </div>
                                        <div className="bg-purple-50 border border-purple-100 rounded-xl p-5">
                                            <p className="text-xs font-bold text-slate-500 uppercase tracking-wide">Total Asignaturas</p>
                                            <p className="text-3xl font-black text-purple-600 mt-1">{new Set(seccionesAgregadas.map(s=>s.cursoId)).size}</p>
                                        </div>
                                        <div className="bg-emerald-50 border border-emerald-100 rounded-xl p-5">
                                            <p className="text-xs font-bold text-slate-500 uppercase tracking-wide">Horas de Clase</p>
                                            <p className="text-3xl font-black text-emerald-600 mt-1">{totalHoras}h</p>
                                        </div>
                                        <div className="bg-amber-50 border border-amber-100 rounded-xl p-5">
                                            <p className="text-xs font-bold text-slate-500 uppercase tracking-wide">Horas Libres (Huecos)</p>
                                            <p className="text-3xl font-black text-amber-600 mt-1">0h</p>
                                        </div>
                                        <div className="col-span-2 border border-slate-200 rounded-xl p-4 bg-slate-50 mt-2">
                                            <p className="text-xs font-bold text-slate-800 mb-3">Distribución por Tipo de Clase</p>
                                            <div className="flex gap-6 text-sm font-bold">
                                                <span className="text-[#5c4cfc]"><i className="fa-solid fa-circle text-[10px] mr-1"></i> Teoría: {seccionesAgregadas.filter(s=>s.itemType==='TP').length}</span>
                                                <span className="text-emerald-500"><i className="fa-solid fa-circle text-[10px] mr-1"></i> Práctica: 0</span>
                                                <span className="text-orange-500"><i className="fa-solid fa-circle text-[10px] mr-1"></i> Laboratorio: {seccionesAgregadas.filter(s=>s.itemType==='LAB').length}</span>
                                            </div>
                                        </div>
                                    </div>
                                )}

                                {activeModal === 'saved' && (
                                    <div className="py-10 border-2 border-dashed border-slate-200 rounded-xl flex flex-col items-center justify-center text-center bg-slate-50">
                                        <i className="fa-regular fa-calendar text-4xl text-slate-300 mb-4"></i>

                                                });

                                        </div>
                                    </div>
                                    
                                    {seccionesAgregadas.length === 0 && (
                                        <div className="absolute inset-0 flex flex-col items-center justify-center pointer-events-none z-30">

                                                <p className="text-[11px] text-slate-500 mb-4 font-medium px-2 leading-relaxed">Haz clic en cualquier curso del catálogo a la izquierda para comenzar a armar tu horario semanal.</p>
                                                <button className="bg-[#5c4cfc] text-white font-bold py-2 px-5 rounded-lg text-xs shadow-md pointer-events-auto w-full"><i className="fa-solid fa-magnifying-glass mr-2"></i>Buscar cursos en el catálogo</button>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>

                        {/* FOOTER HIGH-TECH */}
                        <footer className="tech-footer mt-auto shrink-0 w-full flex flex-col items-center justify-center">

                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
