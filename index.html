                    if (tipo === 'png') {
                        const link = document.createElement('a');
                        link.download = `Horario_CEET_FIQ_${new Date().toISOString().slice(0,10)}.png`;
                        link.href = canvas.toDataURL('image/png', 1.0);
                        link.click();
                        showToast("Imagen exportada con éxito", 'success');
                    } else if (tipo === 'pdf') {
                        const { jsPDF } = window.jspdf;
                        const imgData = canvas.toDataURL('image/png');
                        
                        const pdf = new jsPDF('landscape', 'mm', 'a4');
                        const pdfWidth = pdf.internal.pageSize.getWidth();
                        const pdfHeight = pdf.internal.pageSize.getHeight();
                        
                        // MODIFICACIÓN APLICADA: Calcular el centro perfecto usando matemáticas
                        const margin = 10;
                        const maxImgWidth = pdfWidth - (margin * 2);
                        const maxImgHeight = pdfHeight - (margin * 2);

                        let imgWidth = maxImgWidth;
                        let imgHeight = (canvas.height * imgWidth) / canvas.width;

                        // Limitar la altura si excede el tamaño de la hoja
                        if (imgHeight > maxImgHeight) {
                            imgHeight = maxImgHeight;
                            imgWidth = (canvas.width * imgHeight) / canvas.height;
                        }

                        // Cálculo central horizontal y vertical
                        const xPos = (pdfWidth - imgWidth) / 2;
                        const yPos = (pdfHeight - imgHeight) / 2;

                        pdf.addImage(imgData, 'PNG', xPos, yPos, imgWidth, imgHeight);
                        pdf.save(`Horario_CEET_FIQ_${new Date().toISOString().slice(0,10)}.pdf`);
                        showToast("PDF exportado con éxito", 'success');
                    }
                } catch (err) {
                    console.error("Error al exportar:", err);
                    showToast("Ocurrió un error al generar la exportación.", 'error');
                } finally {
                    setIsExporting(false);
                }
            };

            const diasSemana = ['Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];
            const HORA_INICIO = 8;
            const HORA_FIN = 23;
            const TOTAL_HORAS = HORA_FIN - HORA_INICIO;

            return (
                <React.Fragment>
                    <ConflictModal conflictData={conflictModalData} onClose={() => setConflictModalData(null)} onForceReplace={handleForceReplace} onSelectSuggestion={handleSelectSuggestion} />
                    <ClearModal isOpen={isClearModalOpen} onClose={() => setIsClearModalOpen(false)} onConfirm={confirmLimpiarHorario} />
                    <ExportLoadingModal isOpen={isExporting} />

                    {toast.visible && (
                        <div className={`fixed bottom-6 right-6 px-5 py-3 rounded-xl shadow-[0_10px_40px_rgba(0,0,0,0.15)] flex items-center gap-4 z-[110] animate-[popIn_0.3s_ease-out] border-2 ${toast.type === 'error' ? 'bg-white border-red-500' : 'bg-white border-emerald-500'}`}>
                            <i className={`text-2xl ${toast.type === 'error' ? 'fa-solid fa-circle-exclamation text-red-500' : 'fa-solid fa-circle-check text-emerald-500'}`}></i>
                            <div className={`text-sm font-bold ${toast.type === 'error' ? 'text-red-600' : 'text-slate-700'}`}>{toast.message}</div>
                            <button onClick={() => setToast({visible: false})} className="text-slate-400 hover:text-slate-600 ml-2"><i className="fa-solid fa-xmark"></i></button>
                        </div>
                    )}

                    <header className="bg-white rounded-2xl shadow-sm px-6 py-5 flex items-center justify-between shrink-0 border border-slate-200">
                        <div className="flex items-center gap-5">
                            <div className="w-14 h-14 bg-blue-50 rounded-xl flex items-center justify-center border border-blue-100 shadow-inner">
                                <i className="fa-solid fa-atom text-3xl text-brand-accent"></i>
                            </div>
                            <div>
                                <h1 className="text-xl md:text-2xl font-black text-slate-800 tracking-tight leading-none mb-1">CEET FIQ Centro de Estudios <span className="text-brand">María Estela Toledo</span></h1>
                                <div className="flex items-center gap-3">
                                    <span className="text-xs font-bold text-slate-500 uppercase tracking-wider">Planificador 2026-B</span>
                                    <span className="bg-brand-light text-brand border border-blue-200 text-[10px] font-bold px-2 py-0.5 rounded-full hidden sm:inline-block shadow-sm">"Crecemos juntos, aprendemos mejor"</span>
                                </div>
                            </div>
                        </div>
                        <button className="w-10 h-10 rounded-xl border border-slate-200 text-slate-400 hover:text-brand-accent hover:border-blue-200 hover:bg-blue-50 flex items-center justify-center transition shadow-sm">
                            <i className="fa-solid fa-shield-halved"></i>
                        </button>
                    </header>

                    <div className="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-3 md:gap-4 shrink-0">
                        <div className={`bg-white border ${totalCreditos < MIN_CREDITOS ? 'border-amber-300' : 'border-slate-200'} rounded-2xl p-4 flex items-center gap-4 relative overflow-hidden shadow-sm hover:shadow-md transition`}>
                            <div className={`w-10 h-10 rounded-xl ${totalCreditos < MIN_CREDITOS ? 'bg-amber-50 text-amber-500 border-amber-200' : 'bg-brand-light text-brand border-blue-100'} flex items-center justify-center text-base border`}><i className="fa-solid fa-award"></i></div>
                            <div className="flex-1">
                                <p className={`text-2xl font-black ${totalCreditos < MIN_CREDITOS ? 'text-amber-600' : 'text-slate-800'} leading-none`}>{totalCreditos} <span className="text-xs font-bold text-slate-400">/ {MAX_CREDITOS} máx.</span></p>
                                <p className="text-[10px] text-slate-500 font-bold uppercase mt-1 tracking-wider">Créditos totales</p>
                            </div>
                            <div className="absolute bottom-0 left-0 right-0 h-1.5 bg-slate-100 overflow-hidden"><div className={`h-full ${totalCreditos < MIN_CREDITOS ? 'bg-amber-400' : 'bg-brand-accent'} rounded-r-full transition-all duration-500`} style={{width: `${Math.min((totalCreditos/MAX_CREDITOS)*100, 100)}%`}}></div></div>
                        </div>
                        <div className="bg-white border border-slate-200 rounded-2xl p-4 flex items-center gap-4 shadow-sm hover:shadow-md transition">
                            <div className="w-10 h-10 rounded-xl bg-indigo-50 text-indigo-500 flex items-center justify-center text-base border border-indigo-100"><i className="fa-solid fa-book-open"></i></div>
                            <div>
                                <p className="text-2xl font-black text-slate-800 leading-none">{new Set(seccionesAgregadas.map(s=>s.cursoId)).size}</p>
                                <p className="text-[10px] text-slate-500 font-bold uppercase mt-1 tracking-wider">Cursos activos</p>
                            </div>
                        </div>
                        <div className="bg-white border border-slate-200 rounded-2xl p-4 flex items-center gap-4 shadow-sm hover:shadow-md transition">
                            <div className={`w-10 h-10 rounded-xl flex items-center justify-center text-base border ${crucesCount > 0 ? 'bg-red-50 text-red-500 border-red-100' : 'bg-emerald-50 text-emerald-500 border-emerald-100'}`}><i className="fa-solid fa-code-compare"></i></div>
                            <div>
                                <p className={`text-2xl font-black leading-none ${crucesCount > 0 ? 'text-red-600' : 'text-slate-800'}`}>{crucesCount}</p>
                                <p className="text-[10px] text-slate-500 font-bold uppercase mt-1 tracking-wider">Cruces de horario</p>
                            </div>
                        </div>
                        {/* AQUÍ TERMINA EL FRAGMENTO CORTADO Y COMIENZA LA RECONSTRUCCIÓN */}
                        <div className="bg-white border border-slate-200 rounded-2xl p-4 flex items-center gap-4 shadow-sm hover:shadow-md transition">
                            <div className="w-10 h-10 rounded-xl bg-cyan-50 text-cyan-500 flex items-center justify-center text-base border border-cyan-100"><i className="fa-regular fa-clock"></i></div>
                            <div>
                                <p className="text-2xl font-black text-slate-800 leading-none">{horasSemanales}</p>
                                <p className="text-[10px] text-slate-500 font-bold uppercase mt-1 tracking-wider">Horas de Clase</p>
                            </div>
                        </div>
                    </div>

                    <div className="flex flex-col lg:flex-row gap-4 h-full overflow-hidden mt-2">
                        {/* CONTENEDOR LATERAL (Buscador y Cursos) */}
                        <div className="w-full lg:w-1/3 xl:w-1/4 flex flex-col gap-3 bg-white border border-slate-200 rounded-2xl p-4 shadow-sm overflow-hidden h-[500px] lg:h-auto shrink-0">
                            <div className="flex gap-2">
                                <select value={filtroCiclo} onChange={(e) => setFiltroCiclo(e.target.value)} className="bg-slate-50 border border-slate-200 text-slate-700 text-xs font-bold rounded-xl px-3 py-2 outline-none focus:border-brand-accent w-1/3">
                                    <option value="Todos">Todos</option>
                                    {['I','II','III','IV','V','VI','VII','VIII','IX','X'].map(c => <option key={c} value={c}>Ciclo {c}</option>)}
                                </select>
                                <div className="relative w-2/3">
                                    <i className="fa-solid fa-search absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                                    <input type="text" placeholder="Buscar curso..." value={busqueda} onChange={(e) => setBusqueda(e.target.value)} className="w-full bg-slate-50 border border-slate-200 text-slate-700 text-xs font-bold rounded-xl pl-9 pr-3 py-2 outline-none focus:border-brand-accent placeholder:text-slate-400 font-medium" />
                                </div>
                            </div>
                            <div className="flex-1 overflow-y-auto scroll-clean pr-2 flex flex-col gap-3">
                                {Object.keys(cursosPorCiclo).map(ciclo => (
                                    <div key={ciclo}>
                                        <div className="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2 px-1 border-b border-slate-100 pb-1">Ciclo {ciclo}</div>
                                        <div className="flex flex-col gap-2">
                                            {cursosPorCiclo[ciclo].map(curso => (
                                                <div key={curso.id} className="bg-slate-50 border border-slate-200 rounded-xl p-3 hover:border-brand-accent transition group">
                                                    <div className="font-bold text-xs text-slate-800 leading-tight mb-2">{curso.nombre}</div>
                                                    <div className="flex flex-col gap-1.5">
                                                        {Object.values(curso.seccionesBase).map(sec => (
                                                            <div key={sec.id} className="bg-white border border-slate-100 rounded-lg p-2 shadow-sm">
                                                                <div className="text-[10px] font-bold text-slate-600 mb-1">Sec. {sec.seccion}</div>
                                                                <div className="flex flex-wrap gap-1">
                                                                    {sec.tp.length > 0 && (
                                                                        <button onClick={() => toggleSeccion(curso, `${curso.id}_${sec.seccion}_TP`, sec.seccion, sec.tp, 'TP')} className={`text-[10px] font-bold px-2 py-1 rounded-md transition ${seccionesAgregadas.some(s => s.id === `${curso.id}_${sec.seccion}_TP`) ? 'bg-brand text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`}>TP</button>
                                                                    )}
                                                                    {Object.keys(sec.labs).map(labKey => (
                                                                        <button key={labKey} onClick={() => toggleSeccion(curso, `${curso.id}_${sec.seccion}_${labKey}`, labKey, sec.labs[labKey], 'LAB')} className={`text-[10px] font-bold px-2 py-1 rounded-md transition ${seccionesAgregadas.some(s => s.id === `${curso.id}_${sec.seccion}_${labKey}`) ? 'bg-emerald-500 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`}>{labKey}</button>
                                                                    ))}
                                                                </div>
                                                            </div>
                                                        ))}
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>

                        {/* CONTENEDOR PRINCIPAL (Calendario y Botones) */}
                        <div className="flex-1 flex flex-col gap-3 h-[600px] lg:h-auto shrink-0 relative min-w-0">
                            {/* Toolbar de herramientas */}
                            <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-2 flex justify-between items-center overflow-x-auto scroll-clean">
                                <div className="flex gap-2">
                                    <button onClick={undoAction} disabled={historial.length===0} className="px-3 py-1.5 bg-slate-50 text-slate-600 hover:bg-slate-100 disabled:opacity-50 border border-slate-200 rounded-lg text-xs font-bold transition flex items-center gap-2"><i className="fa-solid fa-rotate-left"></i> Deshacer</button>
                                    <button onClick={triggerLimpiarHorario} disabled={seccionesAgregadas.length===0} className="px-3 py-1.5 bg-red-50 text-red-600 hover:bg-red-100 disabled:opacity-50 border border-red-200 rounded-lg text-xs font-bold transition flex items-center gap-2"><i className="fa-regular fa-trash-can"></i> Vaciar</button>
                                </div>
                                <div className="flex gap-2">
                                    <button onClick={() => exportar('png')} className="px-3 py-1.5 bg-slate-800 text-white hover:bg-slate-700 rounded-lg text-xs font-bold transition shadow-sm flex items-center gap-2"><i className="fa-regular fa-image"></i> PNG</button>
                                    <button onClick={() => exportar('pdf')} className="px-3 py-1.5 bg-red-600 text-white hover:bg-red-700 rounded-lg text-xs font-bold transition shadow-sm flex items-center gap-2"><i className="fa-regular fa-file-pdf"></i> PDF</button>
                                </div>
                            </div>

                            {/* Renderizado de Calendario */}
                            <div className="flex-1 bg-white border border-slate-200 rounded-2xl shadow-sm overflow-auto scroll-clean relative">
                                <div id="export-container" ref={exportTemplateRef} className="min-w-[800px] w-full p-6 bg-white relative">
                                    {/* Cabecera interna para darle mejor formato a la exportación */}
                                    <div className="text-center mb-6 pb-4 border-b border-slate-100">
                                        <h2 className="text-2xl font-black text-slate-800 uppercase tracking-tight">Horario de Clases 2026-B</h2>
                                        <p className="text-sm text-slate-500 font-bold mt-1 uppercase tracking-wider">Facultad de Ingeniería Química - Universidad Nacional del Callao</p>
                                    </div>

                                    <div className="flex relative">
                                        {/* Columna de Horas */}
                                        <div className="w-16 shrink-0 relative mt-8">
                                            {Array.from({length: TOTAL_HORAS + 1}).map((_, i) => (
                                                <div key={i} className="h-[60px] text-right pr-2 relative -top-3">
                                                    <span className="text-[10px] font-black text-slate-400 bg-white px-1">{formatHourLine(HORA_INICIO + i)}</span>
                                                </div>
                                            ))}
                                        </div>

                                        {/* Cuadrícula de Días */}
                                        <div className="flex-1 grid grid-cols-6 grid-bg border-l border-t border-slate-200 relative">
                                            {diasSemana.map(dia => (
                                                <div key={dia} className="border-r border-slate-200 relative">
                                                    <div className="h-8 bg-slate-50 border-b border-slate-200 flex items-center justify-center text-xs font-black text-slate-600 absolute top-0 w-full -mt-8">{dia}</div>
                                                </div>
                                            ))}
                                            
                                            {/* Bloques de Asignaturas */}
                                            {seccionesAgregadas.map((sec, secIdx) => {
                                                const colorClass = borderColors[secIdx % borderColors.length];
                                                const bgClass = colorClass.replace('border-', 'bg-').replace(']', ']/10');
                                                const textClass = colorClass.replace('border-', 'text-');
                                                
                                                return sec.horarios.map((h, hIdx) => {
                                                    const diaIndex = diasSemana.indexOf(h.dia);
                                                    if(diaIndex === -1) return null;
                                                    
                                                    const startMins = timeToMins(h.inicio) - (HORA_INICIO * 60);
                                                    const duration = timeToMins(h.fin) - timeToMins(h.inicio);
                                                    
                                                    const top = (startMins / 60) * 60;
                                                    const height = (duration / 60) * 60;

                                                    return (
                                                        <div key={`${sec.id}_${hIdx}`} className={`absolute left-0 w-full px-1 py-0.5 class-block z-10`} style={{
                                                            left: `${(diaIndex / 6) * 100}%`, width: `${100/6}%`, top: `${top}px`, height: `${height}px`
                                                        }}>
                                                            <div className={`w-full h-full border-l-[3px] ${colorClass} bg-white rounded-r-md shadow-[0_2px_5px_rgba(0,0,0,0.05)] p-1.5 flex flex-col justify-between overflow-hidden group relative`}>
                                                                <div className={`absolute top-0 left-0 w-full h-full opacity-10 pointer-events-none ${colorClass.replace('border-', 'bg-')}`}></div>
                                                                <div>
                                                                    <div className={`text-[8px] font-black tracking-wider uppercase mb-0.5 ${textClass} flex justify-between`}>
                                                                        <span>{h.tipo}-{sec.seccion}</span>
                                                                        <span>{h.aula}</span>
                                                                    </div>
                                                                    <div className="text-[9px] font-bold text-slate-800 leading-tight break-words" title={sec.nombreCurso}>{sec.nombreCurso}</div>
                                                                </div>
                                                                <div>
                                                                    <div className="text-[8px] text-slate-500 font-medium truncate mb-0.5"><i className="fa-solid fa-user-tie text-[7px]"></i> {h.docente}</div>
                                                                    <div className="text-[8px] font-bold text-slate-600 bg-slate-50 px-1 py-0.5 rounded border border-slate-100 inline-block">{h.inicio} - {h.fin}</div>
                                                                </div>
                                                                <button onClick={() => toggleSeccion(sec, sec.id, sec.seccion, sec.horarios, sec.itemType)} className="absolute top-1 right-1 w-4 h-4 bg-red-100 text-red-500 rounded flex items-center justify-center opacity-0 group-hover:opacity-100 transition z-20 hover:bg-red-500 hover:text-white">
                                                                    <i className="fa-solid fa-xmark text-[8px]"></i>
                                                                </button>
                                                            </div>
                                                        </div>
                                                    );
                                                });
                                            })}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </React.Fragment>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
