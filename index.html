                    <ClearModal isOpen={isClearModalOpen} onClose={() => setIsClearModalOpen(false)} onConfirm={confirmLimpiarHorario} />

                    {toast.visible && (
                        <div className={`fixed bottom-6 right-6 px-5 py-3 rounded-xl shadow-lg flex items-center gap-4 z-[110] animate-[popIn_0.3s_ease-out] border-2 ${toast.type === 'error' ? 'bg-white border-red-500' : 'bg-white border-emerald-500'}`}>
                            <div className={`text-sm font-bold ${toast.type === 'error' ? 'text-red-600' : 'text-slate-700'}`}>{toast.message}</div>
                        </div>
                    )}

                    <header className="bg-white rounded-2xl shadow-sm px-6 py-5 flex items-center justify-between shrink-0 border border-slate-200">
                        <div className="flex items-center gap-5">
                            <div className="w-14 h-14 bg-blue-50 rounded-xl flex items-center justify-center border border-blue-100 shadow-inner">
                                <i className="fa-solid fa-atom text-3xl text-brand-accent"></i>
                            </div>
                            <div>
                                <h1 className="text-xl md:text-2xl font-black text-slate-800 tracking-tight leading-none mb-1">CEET FIQ Centro de Estudios <span className="text-brand">María Estela Toledo</span></h1>
                                <div className="flex items-center gap-3">
                                    <span className="text-xs font-bold text-slate-500 uppercase tracking-wider">Planificador 2026-B</span>
                                    <span className="bg-brand-light text-brand border border-blue-200 text-[10px] font-bold px-2 py-0.5 rounded-full hidden sm:inline-block">"Crecemos juntos, aprendemos mejor"</span>
                                </div>
                            </div>
                        </div>
                    </header>

                    <div className="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-3 md:gap-4 shrink-0">
                        <div className="bg-white border border-slate-200 rounded-2xl p-4 flex items-center gap-4 shadow-sm">
                            <div className="w-10 h-10 rounded-xl bg-brand-light text-brand flex items-center justify-center text-base border border-blue-100"><i className="fa-solid fa-award"></i></div>
                            <div><p className="text-2xl font-black text-slate-800 leading-none">{totalCreditos}</p><p className="text-[10px] text-slate-500 font-bold uppercase mt-1">Créditos</p></div>
                        </div>
                        <div className="bg-white border border-slate-200 rounded-2xl p-4 flex items-center gap-4 shadow-sm">
                            <div className="w-10 h-10 rounded-xl bg-indigo-50 text-indigo-500 flex items-center justify-center text-base border border-indigo-100"><i className="fa-solid fa-book-open"></i></div>
                            <div><p className="text-2xl font-black text-slate-800 leading-none">{new Set(seccionesAgregadas.map(s=>s.cursoId)).size}</p><p className="text-[10px] text-slate-500 font-bold uppercase mt-1">Cursos</p></div>
                        </div>
                        <div className="bg-white border border-slate-200 rounded-2xl p-4 flex items-center gap-4 shadow-sm">
                            <div className={`w-10 h-10 rounded-xl flex items-center justify-center text-base border ${crucesCount > 0 ? 'bg-red-50 text-red-500 border-red-100' : 'bg-emerald-50 text-emerald-500 border-emerald-100'}`}><i className="fa-solid fa-code-compare"></i></div>
                            <div><p className={`text-2xl font-black leading-none ${crucesCount > 0 ? 'text-red-600' : 'text-slate-800'}`}>{crucesCount}</p><p className="text-[10px] text-slate-500 font-bold uppercase mt-1">Cruces</p></div>
                        </div>
                        <div className="bg-white border border-slate-200 rounded-2xl p-4 flex items-center gap-4 shadow-sm">
                            <div className="w-10 h-10 rounded-xl bg-cyan-50 text-cyan-500 flex items-center justify-center text-base border border-cyan-100"><i className="fa-regular fa-clock"></i></div>
                            <div><p className="text-2xl font-black text-slate-800 leading-none">{horasSemanales}h</p><p className="text-[10px] text-slate-500 font-bold uppercase mt-1">Semanales</p></div>
                        </div>
                    </div>

                    <div className="flex flex-col lg:flex-row lg:flex-1 lg:min-h-0 gap-3 md:gap-4 pb-2">
                        <div className="w-full lg:w-[350px] shrink-0 bg-white rounded-2xl shadow-sm border border-slate-200 flex flex-col h-[500px] lg:h-auto overflow-hidden">
                            <div className="p-5 border-b border-slate-100 bg-slate-50/50">
                                <h2 className="font-black text-base text-slate-800 mb-4 flex items-center gap-2"><i className="fa-solid fa-layer-group text-brand-accent"></i> Catálogo</h2>
                                <div className="space-y-3">
                                    <input type="text" placeholder="Buscar curso..." className="w-full pl-4 pr-3 py-2.5 bg-white border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-brand-accent transition-all" value={busqueda} onChange={(e) => setBusqueda(e.target.value)} />
                                    <select className="w-full px-3 py-2.5 bg-white border border-slate-200 rounded-xl text-sm font-bold text-slate-600" value={filtroCiclo} onChange={(e) => setFiltroCiclo(e.target.value)}>
                                        <option value="Todos">Todos los ciclos</option>
                                        <option value="I">I</option><option value="II">II</option><option value="III">III</option><option value="IV">IV</option><option value="V">V</option><option value="VI">VI</option><option value="VII">VII</option><option value="VIII">VIII</option><option value="IX">IX</option><option value="X">X</option>
                                    </select>
                                </div>
                            </div>
                            <div className="flex-1 overflow-y-auto scroll-clean p-4 bg-[#f8fafc]">
                                {Object.keys(cursosPorCiclo).map(cicloKey => (
                                    <div key={cicloKey} className="mb-6">
                                        <span className="font-black text-xs text-brand bg-brand-light px-2.5 py-1 rounded-md tracking-wider border border-blue-100">CICLO {cicloKey}</span>
                                        {cursosPorCiclo[cicloKey].map((curso, idx) => {
                                            const bColor = borderColors[idx % borderColors.length];
                                            return (
                                                <div key={curso.id} className={`mt-4 bg-white border border-slate-200 border-l-[4px] rounded-xl overflow-hidden shadow-sm ${bColor}`}>
                                                    <div className="p-4">
                                                        <h3 className="font-black text-[12px] uppercase text-slate-800 mb-2">{curso.nombre}</h3>
                                                        <div className="space-y-3">
                                                            {Object.values(curso.seccionesBase).map(base => {
                                                                const tpID = `${curso.id}_${base.seccion}_TP`;
                                                                const isTPAdded = seccionesAgregadas.some(s => s.id === tpID);
                                                                return (
                                                                    <div key={base.id} className="space-y-2">
                                                                        <div className={`border rounded-xl p-3 bg-white transition-all ${isTPAdded ? 'border-brand-accent bg-blue-50/50' : 'border-slate-200'}`}>
                                                                            <div className="flex justify-between items-center mb-2">
                                                                                <span className="text-[10px] font-black">SEC {base.seccion}</span>
                                                                                <button onClick={() => toggleSeccion(curso, tpID, base.seccion, base.tp, 'TP')} className={`w-7 h-7 rounded-lg flex items-center justify-center transition-all border ${isTPAdded ? 'bg-red-50 text-red-500' : 'bg-white text-brand-accent'}`}>
                                                                                    <i className={`fa-solid ${isTPAdded ? 'fa-minus' : 'fa-plus'}`}></i>
                                                                                </button>
                                                                            </div>
                                                                            {base.tp.map((h, i) => (
                                                                                <div key={i} className="text-[10px] text-slate-600">
                                                                                    <b>{h.dia}</b> {h.inicio}-{h.fin} | {h.aula}
                                                                                </div>
                                                                            ))}
                                                                        </div>
                                                                        {Object.keys(base.labs).map(labSec => {
                                                                            const labID = `${curso.id}_${labSec}_LAB`;
                                                                            const isLabAdded = seccionesAgregadas.some(s => s.id === labID);
                                                                            return (
                                                                                <div key={labSec} className={`ml-4 border rounded-xl p-3 bg-white ${isLabAdded ? 'border-brand-accent bg-blue-50/50' : 'border-slate-200'}`}>
                                                                                    <div className="flex justify-between items-center mb-1">
                                                                                        <span className="text-[9px] font-bold text-brand-accent">LAB {labSec}</span>
                                                                                        <button onClick={() => toggleSeccion(curso, labID, labSec, base.labs[labSec], 'LAB')} className={`w-5 h-5 rounded-md flex items-center justify-center border ${isLabAdded ? 'bg-red-50 text-red-500' : 'bg-white text-brand-accent'}`}><i className={`fa-solid ${isLabAdded ? 'fa-minus' : 'fa-plus'} text-[8px]`}></i></button>
                                                                                    </div>
                                                                                </div>
                                                                            )
                                                                        })}
                                                                    </div>
                                                                )
                                                            })}
                                                        </div>
                                                    </div>
                                                </div>
                                            )
                                        })}
                                    </div>
                                ))}
                            </div>
                        </div>

                        <div className="flex-1 bg-white rounded-2xl shadow-sm border border-slate-200 flex flex-col min-h-[600px] lg:min-h-0 lg:h-auto overflow-hidden">
                            <div className="px-6 py-4 border-b border-slate-100 flex justify-between items-center bg-white">
                                <h2 className="font-black text-lg text-slate-800">Mi Horario</h2>
                                <div className="flex gap-2">
                                    <button onClick={() => setIsClearModalOpen(true)} className="bg-red-50 text-red-500 px-4 py-2 rounded-xl text-xs font-bold border border-red-100">Vaciar</button>
                                    <div className="relative">
                                        <button onClick={() => setDropdownOpen(!dropdownOpen)} className="bg-brand text-white px-4 py-2 rounded-xl text-xs font-bold">Exportar <i className="fa-solid fa-chevron-down ml-1"></i></button>
                                        <div className={`absolute right-0 mt-2 w-48 bg-white rounded-xl shadow-xl border z-[100] dropdown-menu ${dropdownOpen ? 'dropdown-open' : 'dropdown-closed'}`}>
                                            <button onClick={exportarPNG} className="w-full text-left px-4 py-3 text-xs font-bold text-slate-700 hover:bg-blue-50">Descargar Imagen (PNG)</button>
                                            <button onClick={exportarPDF} className="w-full text-left px-4 py-3 text-xs font-bold text-slate-700 hover:bg-red-50">Descargar PDF</button>
                                            <button onClick={exportarWord} className="w-full text-left px-4 py-3 text-xs font-bold text-slate-700 hover:bg-indigo-50">Descargar Word (DOC)</button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div className="flex-1 overflow-auto scroll-clean w-full">
                                <div className="min-w-[700px] lg:min-w-full relative" style={{ height: `${TOTAL_HORAS * 60 + 40}px` }}>
                                    <div className="flex border-b border-slate-200 bg-[#f8fafc] sticky top-0 z-30">
                                        <div className="w-16 border-r border-slate-200 shrink-0"></div>
                                        {diasSemana.map(dia => (<div key={dia} className="flex-1 text-center py-3 font-black text-xs text-slate-700 uppercase border-r border-slate-200 last:border-0">{dia}</div>))}
                                    </div>
                                    <div className="relative w-full" style={{ height: `${TOTAL_HORAS * 60}px` }}>
                                        <div className="absolute inset-0 flex">
                                            <div className="w-16 shrink-0 border-r border-slate-200 bg-[#f8fafc]/50"></div>
                                            {diasSemana.map((_, i) => (<div key={i} className="flex-1 border-r border-slate-100 last:border-0 grid-bg"></div>))}
                                        </div>
                                        {seccionesAgregadas.map((seccion, sIdx) => {
                                            const colores = ['bg-[#eff6ff] border-[#3b82f6] text-[#1e3a8a]', 'bg-[#f0fdf4] border-[#10b981] text-[#064e3b]', 'bg-[#fdf2f8] border-[#ec4899] text-[#831843]', 'bg-[#fffbeb] border-[#f59e0b] text-[#78350f]'];
                                            const color = seccion.itemType === 'LAB' ? 'bg-[#f8fafc] border-[#64748b] text-[#334155]' : colores[sIdx % colores.length];
                                            return seccion.horarios.map((horario, hIdx) => {
                                                const colIndex = diasSemana.indexOf(horario.dia);
                                                const startMin = timeToMins(horario.inicio);
                                                const offsetTop = startMin - (HORA_INICIO * 60);
                                                const duration = timeToMins(horario.fin) - startMin;
                                                return (
                                                    <div key={`${sIdx}-${hIdx}`} className={`absolute class-block rounded-xl border-l-[4px] p-2 flex flex-col items-center justify-center text-center overflow-hidden z-20 ${color}`} style={{ top: `${offsetTop}px`, height: `${duration}px`, width: `calc((100% - 64px) / 6 - 8px)`, left: `calc(64px + ((100% - 64px) / 6) * ${colIndex} + 4px)` }}>
                                                        <span className="font-black text-[9px] leading-tight mb-1 uppercase">{seccion.nombreCurso}</span>
                                                        <span className="font-bold text-[8px] opacity-80">{horario.inicio}-{horario.fin} | {horario.aula}</span>
                                                    </div>
                                                )
                                            });
                                        })}
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <footer className="w-full bg-[#0f172a] shrink-0 flex flex-col items-center justify-center pt-4 pb-6 mt-2 relative overflow-hidden">
                        <div className="globe-container"><div className="globe">{[...Array(7)].map((_,i)=><div key={i} className="ring"></div>)}</div></div>
                        <div className="creator-text">C R E A D O &nbsp; P O R &nbsp; S E B A S T I A N</div>
                        <div className="copyright-text">© 2026 UNAC - Integración Estudiantil.</div>
                    </footer>

                    {/* BLOQUE DE EXPORTACIÓN OCULTO - OPTIMIZADO PARA HTML2CANVAS */}
                    <div ref={hiddenExportRef} style={{ width: '1400px', backgroundColor: '#ffffff', position: 'absolute', top: '-10000px', left: '-10000px', padding: '40px', fontFamily: 'Arial, sans-serif' }}>
                        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', borderBottom: '4px solid #1e40af', paddingBottom: '20px', marginBottom: '20px' }}>
                            <div style={{ display: 'flex', alignItems: 'center', gap: '20px' }}>
                                <div style={{ width: '70px', height: '70px', backgroundColor: '#eff6ff', borderRadius: '15px', display: 'flex', alignItems: 'center', justifyContent: 'center', border: '2px solid #bfdbfe' }}>
                                    <i className="fa-solid fa-atom" style={{ fontSize: '35px', color: '#3b82f6' }}></i>
                                </div>
                                <div>
                                    <h1 style={{ margin: '0', fontSize: '28px', color: '#0f172a', fontWeight: '900' }}>CEET FIQ Centro de Estudios <span style={{ color: '#1e40af' }}>María Estela Toledo</span></h1>
                                    <p style={{ margin: '0', fontSize: '16px', color: '#3b82f6', fontWeight: '800' }}>PROGRAMACIÓN HORARIA 2026-B</p>
                                </div>
                            </div>
                            <div style={{ textAlign: 'right' }}>
                                <p style={{ margin: '0', fontSize: '14px', fontStyle: 'italic', color: '#64748b' }}>"Crecemos juntos, aprendemos mejor"</p>
                                <p style={{ margin: '5px 0 0 0', fontSize: '12px', color: '#94a3b8' }}>Créditos Totales: {totalCreditos}</p>
                            </div>
                        </div>

                        <div style={{ border: '2px solid #e2e8f0', borderRadius: '15px', overflow: 'hidden' }}>
                            <div style={{ display: 'flex', backgroundColor: '#f8fafc', borderBottom: '2px solid #e2e8f0' }}>
                                <div style={{ width: '70px', padding: '15px 0', textAlign: 'center', fontWeight: '900', color: '#64748b', fontSize: '12px' }}>HORA</div>
                                {diasSemana.map(d => <div key={d} style={{ flex: 1, padding: '15px 0', textAlign: 'center', fontWeight: '900', color: '#0f172a', fontSize: '14px', borderLeft: '1px solid #e2e8f0' }}>{d}</div>)}
                            </div>
                            <div style={{ position: 'relative', height: `${TOTAL_HORAS * 60}px` }}>
                                <div style={{ position: 'absolute', top: 0, left: 0, width: '100%', height: '100%', display: 'flex' }}>
                                    <div style={{ width: '70px', height: '100%', borderRight: '2px solid #e2e8f0', backgroundColor: '#f8fafc' }}></div>
                                    {diasSemana.map((_, i) => <div key={i} style={{ flex: 1, borderRight: '1px solid #f1f5f9', backgroundSize: '100% 60px', backgroundImage: 'linear-gradient(to bottom, #f1f5f9 1px, transparent 1px)' }}></div>)}
                                </div>
                                <div style={{ position: 'absolute', top: 0, left: 0, width: '70px', fontSize: '11px', color: '#475569', fontWeight: 'bold' }}>
                                    {Array.from({length: TOTAL_HORAS + 1}).map((_, i) => <div key={i} style={{ height: '60px', borderBottom: '1px solid #e2e8f0', textAlign: 'center', lineHeight: '60px' }}>{formatHourLine(i + HORA_INICIO)}</div>)}
                                </div>
                                {seccionesAgregadas.map((seccion, sIdx) => {
                                    const colores = [{bg: '#eff6ff', br: '#3b82f6', tx: '#1e40af'}, {bg: '#f0fdf4', br: '#10b981', tx: '#166534'}, {bg: '#fdf2f8', br: '#ec4899', tx: '#9d174d'}, {bg: '#fffbeb', br: '#f59e0b', tx: '#92400e'}];
                                    const c = seccion.itemType === 'LAB' ? {bg: '#f8fafc', br: '#64748b', tx: '#334155'} : colores[sIdx % colores.length];
                                    return seccion.horarios.map((horario, hIdx) => {
                                        const colIndex = diasSemana.indexOf(horario.dia);
                                        const startMin = timeToMins(horario.inicio);
                                        const offsetTop = startMin - (HORA_INICIO * 60);
                                        const duration = timeToMins(horario.fin) - startMin;
                                        return (
                                            <div key={`exp-${sIdx}-${hIdx}`} style={{ position: 'absolute', top: `${offsetTop}px`, left: `calc(70px + (100% - 70px)/6 * ${colIndex} + 5px)`, height: `${duration}px`, width: `calc((100% - 70px)/6 - 10px)`, backgroundColor: c.bg, borderLeft: `5px solid ${c.br}`, padding: '10px', boxSizing: 'border-box', display: 'flex', flexDirection: 'column', justifyContent: 'center', alignItems: 'center', textAlign: 'center', borderRadius: '8px', zIndex: '10' }}>
                                                <div style={{ fontWeight: '900', fontSize: '11px', color: '#0f172a', marginBottom: '4px', textTransform: 'uppercase' }}>{seccion.nombreCurso}</div>
                                                <div style={{ fontWeight: 'bold', fontSize: '10px', color: c.tx }}>{seccion.codigo} | SEC {seccion.seccion}</div>
                                                <div style={{ fontSize: '10px', marginTop: '4px', color: '#475569' }}>{horario.inicio} - {horario.fin} | <b>{horario.aula}</b></div>
                                            </div>
                                        )
                                    });
                                })}
                            </div>
                        </div>
                        <div style={{ marginTop: '20px', borderTop: '2px solid #e2e8f0', paddingTop: '15px', display: 'flex', justifyContent: 'space-between' }}>
                            <p style={{ margin: '0', fontSize: '12px', color: '#94a3b8' }}>© 2026 UNAC - Facultad de Ingeniería Química</p>
                            <p style={{ margin: '0', fontSize: '14px', fontWeight: '900', color: '#3b82f6', letterSpacing: '2px' }}>CREADO POR SEBASTIAN</p>
                        </div>
                    </div>
                </React.Fragment>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
