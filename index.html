                const fin = timeMatch[2];

                const restCol3 = col3.substring(timeMatch[0].length).trim().split(' ');
                let tipo = "T";
                let cupos = "40";
                const tipoIndex = restCol3.findIndex(w => w === 'T' || w === 'P' || w === 'L');
                if (tipoIndex !== -1) {
                    tipo = restCol3[tipoIndex];
                    cupos = restCol3[tipoIndex + 1] || "40";
                }
                
                let aula = restCol3[0] && restCol3[0] !== 'PRESENCIAL' && restCol3[0] !== 'VIRTUAL' ? restCol3[0] : "LAB";

                if (!courseMap[cursoNombre]) {
                    courseMap[cursoNombre] = { id: cursoNombre, nombre: cursoNombre, codigo: codigo, ciclo: ciclo, creditos: 4, seccionesBase: {} };
                }

                const baseSeccion = seccion.split(' ')[0];
                
                if (!courseMap[cursoNombre].seccionesBase[baseSeccion]) {
                    courseMap[cursoNombre].seccionesBase[baseSeccion] = {
                        id: `${cursoNombre}_${baseSeccion}`, seccion: baseSeccion, 
                        tp: [], labs: {}
                    };
                }

                const claseObj = { dia, inicio, fin, tipo, aula, docente, cupos };

                if (tipo === 'L' || seccion.includes('G')) {
                    if (!courseMap[cursoNombre].seccionesBase[baseSeccion].labs[seccion]) {
                        courseMap[cursoNombre].seccionesBase[baseSeccion].labs[seccion] = [];
                    }
                    courseMap[cursoNombre].seccionesBase[baseSeccion].labs[seccion].push(claseObj);
                } else {
                    courseMap[cursoNombre].seccionesBase[baseSeccion].tp.push(claseObj);
                }
            });

            return Object.values(courseMap);
        };

        const dbCursos = parseData();
        const borderColors = ['border-purple-500', 'border-emerald-500', 'border-blue-500', 'border-orange-500', 'border-pink-500'];

        const App = () => {
            const [seccionesAgregadas, setSeccionesAgregadas] = useState([]);
            const [historial, setHistorial] = useState([]);
            const [filtroCiclo, setFiltroCiclo] = useState('Todos');
            const [busqueda, setBusqueda] = useState('');
            const calendarRef = useRef(null);

            const timeToMins = (timeStr) => {
                if(!timeStr) return 0;
                const [h, m] = timeStr.split(':').map(Number);
                return (h * 60) + m;
            };

            const formatHourLine = (num) => {
                return `${String(num).padStart(2, '0')}:00`;
            };

            const { totalCreditos, crucesCount, horasSemanales, horasLibres } = useMemo(() => {
                let creditos = 0;
                let cruces = 0;
                let minsClase = 0;
                let huecosMins = 0;
                const uniqueCursos = new Set();
                const bloques = [];
                const diasMap = {};

                seccionesAgregadas.forEach(sec => {
                    if (!uniqueCursos.has(sec.cursoId)) { 
                        creditos += (sec.creditos || 4); 
                        uniqueCursos.add(sec.cursoId); 
                    }
                    sec.horarios.forEach(h => {
                        const start = timeToMins(h.inicio);
                        const end = timeToMins(h.fin);
                        minsClase += (end - start);
                        bloques.push({ dia: h.dia, inicio: start, fin: end });
                        
                        if(!diasMap[h.dia]) diasMap[h.dia] = [];
                        diasMap[h.dia].push({ start, end });
                    });
                });

                for(let i=0; i < bloques.length; i++){
                    for(let j=i+1; j < bloques.length; j++){
                        const b1 = bloques[i], b2 = bloques[j];
                        if(b1.dia === b2.dia && b1.inicio < b2.fin && b1.fin > b2.inicio) cruces++;
                    }
                }

                Object.values(diasMap).forEach(clases => {
                    clases.sort((a,b) => a.start - b.start);
                    for(let i=0; i<clases.length-1; i++){
                        const gap = clases[i+1].start - clases[i].end;
                        if (gap > 0) huecosMins += gap;
                    }
                });

                return { totalCreditos: creditos, crucesCount: cruces, horasSemanales: Math.round(minsClase / 60), horasLibres: Math.round(huecosMins / 60) };
            }, [seccionesAgregadas]);

            const cursosFiltrados = dbCursos.filter(c => {
                const matchCiclo = filtroCiclo === 'Todos' || c.ciclo === filtroCiclo;
                const searchTxt = busqueda.toLowerCase();
                const matchBus = c.nombre.toLowerCase().includes(searchTxt) || c.codigo.toLowerCase().includes(searchTxt);
                return matchCiclo && matchBus;
            });

            const cursosPorCiclo = useMemo(() => {
                return cursosFiltrados.reduce((acc, curso) => {
                    if (!acc[curso.ciclo]) acc[curso.ciclo] = [];
                    acc[curso.ciclo].push(curso);
                    return acc;
                }, {});
            }, [cursosFiltrados]);

            const toggleSeccion = (curso, itemID, nombreSeccion, horariosArray, itemType) => {
                setHistorial(prev => [...prev, seccionesAgregadas]); 
                const isAdded = seccionesAgregadas.some(s => s.id === itemID);
                let newArr;
                if (isAdded) {
                    newArr = seccionesAgregadas.filter(s => s.id !== itemID);
                } else {
                    const clean = seccionesAgregadas.filter(s => {
                        if (s.cursoId !== curso.id) return true;
                        return s.itemType !== itemType; 
                    });
                    newArr = [...clean, { 
                        id: itemID, cursoId: curso.id, nombreCurso: curso.nombre, 
                        seccion: nombreSeccion, horarios: horariosArray, itemType: itemType, creditos: curso.creditos, codigo: curso.codigo
                    }];
                }
                setSeccionesAgregadas(newArr);
            };

            const limpiarHorario = () => {
                if(seccionesAgregadas.length > 0 && confirm("¿Vaciar todo el horario?")) {
                    setHistorial(prev => [...prev, seccionesAgregadas]);
                    setSeccionesAgregadas([]);
                }
            };

            const undoAction = () => {
                if (historial.length > 0) {
                    const prevState = historial[historial.length - 1];
                    setSeccionesAgregadas(prevState);
                    setHistorial(historial.slice(0, -1));
                }
            };

            const exportarPNG = () => {
                if(calendarRef.current) {
                    html2canvas(calendarRef.current, { scale: 2, backgroundColor: '#ffffff' }).then(canvas => {
                        const link = document.createElement('a');
                        link.download = 'Horario_CEET_FIQ.png';
                        link.href = canvas.toDataURL('image/png');
                        link.click();
                    });
                }
            };

            const diasSemana = ['Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];
            const HORA_INICIO = 8;
            const HORA_FIN = 23;
            const TOTAL_HORAS = HORA_FIN - HORA_INICIO;

            return (
                <React.Fragment>
                    {/* HEADER */}
                    <header className="bg-white rounded-xl shadow-sm px-5 py-4 flex items-center justify-between shrink-0 border border-slate-200">
                        <div>
                            <h1 className="text-xl md:text-2xl font-bold text-slate-800">Facultad de Ingeniería Química</h1>
                            <div className="flex items-center gap-2 mt-1">
                                <span className="text-sm font-semibold text-brand">Integración Estudiantil - Planificador de Horarios 2026-B</span>
                                <span className="bg-[#e8f5e9] text-[#2e7d32] border border-[#c8e6c9] text-[10px] font-bold px-2 py-0.5 rounded-full hidden sm:inline-block">"De estudiantes para estudiantes"</span>
                            </div>
                        </div>
                        <button className="w-10 h-10 rounded-lg border border-slate-200 text-slate-400 hover:text-slate-600 hover:bg-slate-50 flex items-center justify-center transition">
                            <i className="fa-solid fa-shield-halved"></i>
                        </button>
                    </header>

                    {/* KPI CARDS */}
                    <div className="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-3 md:gap-4 shrink-0">
                        <div className="bg-white border border-slate-200 rounded-xl p-4 flex items-center gap-3 relative overflow-hidden">
                            <div className="w-8 h-8 rounded-full bg-[#e8f5e9] text-[#2e7d32] flex items-center justify-center text-sm"><i className="fa-solid fa-award"></i></div>
                            <div className="flex-1">
                                <p className="text-xl font-bold text-slate-800 leading-none">{totalCreditos} <span className="text-[11px] font-medium text-slate-400">/ 26 máx.</span></p>
                                <p className="text-[10px] text-slate-500 font-medium mt-1">Créditos totales</p>
                            </div>
                            <div className="absolute bottom-0 left-4 right-4 h-1 bg-slate-100 rounded-full overflow-hidden"><div className="h-full bg-[#2e7d32] rounded-full transition-all" style={{width: `${Math.min((totalCreditos/26)*100, 100)}%`}}></div></div>
                        </div>
                        <div className="bg-white border border-slate-200 rounded-xl p-4 flex items-center gap-3">
                            <div className="w-8 h-8 rounded-full bg-blue-50 text-blue-500 flex items-center justify-center text-sm"><i className="fa-solid fa-book-open"></i></div>
                            <div>
                                <p className="text-xl font-bold text-slate-800 leading-none">{new Set(seccionesAgregadas.map(s=>s.cursoId)).size}</p>
                                <p className="text-[10px] text-slate-500 font-medium mt-1">Cursos matriculados</p>
                            </div>
                        </div>
                        <div className="bg-white border border-slate-200 rounded-xl p-4 flex items-center gap-3">
                            <div className={`w-8 h-8 rounded-full flex items-center justify-center text-sm ${crucesCount > 0 ? 'bg-red-50 text-red-500' : 'bg-emerald-50 text-emerald-500'}`}><i className="fa-solid fa-check-double"></i></div>
                            <div>
                                <p className={`text-xl font-bold leading-none ${crucesCount > 0 ? 'text-red-600' : 'text-slate-800'}`}>{crucesCount}</p>
                                <p className="text-[10px] text-slate-500 font-medium mt-1">Cruces de horario</p>
                            </div>
                        </div>
                        <div className="bg-white border border-slate-200 rounded-xl p-4 flex items-center gap-3">
                            <div className="w-8 h-8 rounded-full bg-orange-50 text-orange-500 flex items-center justify-center text-sm"><i className="fa-regular fa-clock"></i></div>
                            <div>
                                <p className="text-xl font-bold text-slate-800 leading-none">{horasSemanales}h</p>
                                <p className="text-[10px] text-slate-500 font-medium mt-1">Horas semanales de clase</p>
                            </div>
                        </div>
                        <div className="bg-white border border-slate-200 rounded-xl p-4 flex items-center gap-3 col-span-2 md:col-span-4 lg:col-span-1">
                            <div className="w-8 h-8 rounded-full bg-teal-50 text-teal-500 flex items-center justify-center text-sm"><i className="fa-solid fa-plug"></i></div>
                            <div>
                                <p className="text-xl font-bold text-slate-800 leading-none">{horasLibres}h</p>
                                <p className="text-[10px] text-slate-500 font-medium mt-1">Tiempo libre entre cursos</p>
                            </div>
                        </div>
                    </div>

                    {/* MAIN AREA */}
                    <div className="flex-1 min-h-0 flex flex-col lg:flex-row gap-3 md:gap-4 pb-2">
                        
                        {/* PANEL IZQUIERDO: CATÁLOGO */}
                        <div className="w-full lg:w-[320px] shrink-0 bg-white rounded-xl shadow-sm border border-slate-200 flex flex-col h-[500px] lg:h-auto">
                            <div className="p-4 border-b border-slate-100">
                                <h2 className="font-bold text-[15px] text-slate-800 mb-3">Catálogo de Cursos</h2>
                                <div className="relative mb-3">
                                    <i className="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-slate-400 text-sm"></i>
                                    <input type="text" placeholder="Buscar curso, código o docente..." className="w-full pl-9 pr-3 py-2 bg-slate-50 border border-slate-200 rounded-md text-sm focus:outline-none focus:border-brand" value={busqueda} onChange={(e) => setBusqueda(e.target.value)} />
                                </div>
                                <select className="w-full px-3 py-2 bg-white border border-slate-200 rounded-md text-sm text-slate-600 focus:outline-none focus:border-brand cursor-pointer" value={filtroCiclo} onChange={(e) => setFiltroCiclo(e.target.value)}>
                                    <option value="Todos">Todos los ciclos</option>
                                    <option value="I">CICLO I</option><option value="II">CICLO II</option><option value="III">CICLO III</option><option value="IV">CICLO IV</option><option value="V">CICLO V</option><option value="VI">CICLO VI</option><option value="VII">CICLO VII</option><option value="VIII">CICLO VIII</option><option value="IX">CICLO IX</option><option value="X">CICLO X</option>
                                </select>
                            </div>
                            
                            <div className="flex-1 overflow-y-auto scroll-clean p-3">
                                {Object.keys(cursosPorCiclo).map(cicloKey => (
                                    <div key={cicloKey} className="mb-6">
                                        <div className="flex justify-between items-center mb-2 px-1">
                                            <span className="font-bold text-xs text-slate-700 uppercase">CICLO {cicloKey}</span>
                                            <span className="text-[10px] text-slate-400 font-medium">{cursosPorCiclo[cicloKey].length} cursos <i className="fa-solid fa-chevron-up ml-1 text-[8px]"></i></span>
                                        </div>
                                        
                                        {cursosPorCiclo[cicloKey].map((curso, idx) => {
                                            const bColor = borderColors[idx % borderColors.length];
                                            return (
                                                <div key={curso.id} className={`mb-3 bg-white border border-slate-200 border-l-[3px] rounded-lg overflow-hidden ${bColor}`}>
                                                    <div className="p-3">
                                                        <div className="flex justify-between items-start mb-1">
                                                            <h3 className="font-bold text-[11px] uppercase text-slate-800 leading-tight pr-2">{curso.nombre}</h3>
                                                            <span className="bg-slate-50 text-slate-600 border border-slate-100 text-[9px] px-1.5 py-0.5 rounded whitespace-nowrap">{Object.keys(curso.seccionesBase).length} secciones</span>
                                                        </div>
                                                        <div className="flex items-center gap-1.5 mb-3 text-[9px] text-slate-500">
                                                            <span className="bg-[#e8f5e9] text-[#2e7d32] font-bold px-1.5 py-0.5 rounded uppercase">{curso.codigo}</span>
                                                            <span>• {curso.creditos} Créditos - plan 2026</span>
                                                        </div>
                                                        
                                                        <div className="space-y-2">
                                                            {Object.values(curso.seccionesBase).map(base => {
                                                                const hasTP = base.tp.length > 0;
                                                                const labs = Object.keys(base.labs);
                                                                const tpID = `${curso.id}_${base.seccion}_TP`;
                                                                const isTPAdded = seccionesAgregadas.some(s => s.id === tpID);

                                                                const docentePrincipal = hasTP ? base.tp[0].docente : (labs.length > 0 ? base.labs[labs[0]][0].docente : "Profesor");
                                                                const cupos = hasTP ? base.tp[0].cupos : (labs.length > 0 ? base.labs[labs[0]][0].cupos : "40");

                                                                return (
                                                                    <div key={base.id} className="space-y-2">
                                                                        {hasTP && (
                                                                            <div className={`border rounded-lg p-3 bg-white transition-all ${isTPAdded ? 'border-emerald-400 bg-emerald-50/30' : 'border-slate-100'}`}>
                                                                                <div className="flex justify-between items-center mb-2">
                                                                                    <span className="bg-slate-50 text-slate-700 text-[10px] font-semibold px-2 py-1 rounded border border-slate-100">SECCIÓN {base.seccion}</span>
                                                                                    <button onClick={() => toggleSeccion(curso, tpID, base.seccion, base.tp, 'TP')} className={`w-6 h-6 rounded flex items-center justify-center transition-colors border ${isTPAdded ? 'bg-red-50 border-red-200 text-red-500' : 'bg-slate-50 border-slate-200 text-slate-500 hover:bg-slate-100'}`}>
                                                                                        <i className={`fa-solid ${isTPAdded ? 'fa-minus text-[10px]' : 'fa-plus text-[10px]'}`}></i>
                                                                                    </button>
                                                                                </div>
                                                                                
                                                                                <div className="flex items-center justify-between mb-2">
                                                                                    <span className="text-[10px] font-bold text-slate-700 truncate w-[130px]" title={docentePrincipal}>{docentePrincipal}</span>
                                                                                    <div className="flex items-center gap-1 text-[9px] text-slate-500">
                                                                                        <div className="w-1.5 h-1.5 rounded-full bg-emerald-500"></div> Vacantes: {cupos}
                                                                                    </div>
                                                                                </div>
                                                                                
                                                                                <div className="space-y-1">
                                                                                    {base.tp.map((h, i) => (
                                                                                        <div key={i} className="flex items-center justify-between text-[10px]">
                                                                                            <span className="font-bold text-slate-800 w-8">{h.dia}</span>
                                                                                            <span className="text-slate-500">{h.inicio} a {h.fin}</span>
                                                                                            <span className="bg-slate-100 text-slate-600 px-1.5 py-0.5 rounded">{h.aula}</span>
                                                                                        </div>
                                                                                    ))}
                                                                                </div>
                                                                            </div>
                                                                        )}
                                                                        {/* Simplifiqué la vista de Laboratorios para mantener el código más corto, pero la lógica sigue ahí si la necesitas agregar */}
                                                                    </div>
                                                                )
                                                            })}
                                                        </div>
                                                    </div>
                                                </div>
                                            )
                                        })}
                                    </div>
                                ))}
                            </div>
                        </div>

                        {/* PANEL DERECHO: CALENDARIO */}
                        <div className="flex-1 bg-white rounded-xl shadow-sm border border-slate-200 flex flex-col min-h-[600px] lg:h-auto relative overflow-hidden">
                            
                            {/* Toolbar Calendario */}
                            <div className="px-5 py-3 border-b border-slate-100 flex justify-between items-center bg-white z-20 flex-wrap gap-3">
                                <div className="flex items-center gap-2">
                                    <i className="fa-regular fa-calendar-days text-brand text-lg"></i>
                                    <h2 className="font-bold text-[15px] text-slate-800">Mi Horario</h2>
                                    <span className="bg-slate-50 text-slate-400 border border-slate-200 text-[10px] px-2 py-0.5 rounded ml-1">Horario Semanal</span>
                                </div>
                                <div className="flex items-center gap-2">
                                    <button className="bg-[#10b981] hover:bg-[#059669] text-white px-3 py-1.5 rounded text-[11px] font-medium transition flex items-center gap-2">
                                        <i className="fa-solid fa-floppy-disk"></i> Guardar horario
                                    </button>
                                    <button onClick={limpiarHorario} className="bg-white border border-red-400 text-red-500 hover:bg-red-50 px-3 py-1.5 rounded text-[11px] font-medium transition flex items-center gap-2">
                                        <i className="fa-regular fa-trash-can"></i> Vaciar Horario
                                    </button>
                                    <button onClick={undoAction} disabled={historial.length === 0} className="bg-white border border-slate-200 text-slate-500 hover:bg-slate-50 px-2.5 py-1.5 rounded text-[11px] transition flex items-center justify-center disabled:opacity-50">
                                        <i className="fa-solid fa-rotate-left"></i>
                                    </button>
                                    <button onClick={exportarPNG} className="bg-[#0d5c35] hover:bg-[#0a482a] text-white px-3 py-1.5 rounded text-[11px] font-medium transition flex items-center gap-2">
                                        <i className="fa-solid fa-download"></i> Descargar Horario <i className="fa-solid fa-chevron-down text-[9px] ml-1"></i>
                                    </button>
                                </div>
                            </div>

                            {/* Grid del Calendario */}
                            <div className="flex-1 overflow-auto bg-white scroll-clean w-full relative">
                                <div ref={calendarRef} className="min-w-[700px] lg:min-w-full relative" style={{ height: `${TOTAL_HORAS * 60 + 40}px` }}>
                                    
                                    {/* Cabecera de Días */}
                                    <div className="flex border-b border-slate-200 bg-[#F4F7F6] sticky top-0 z-30">
                                        <div className="w-14 border-r border-slate-200 shrink-0 flex items-center justify-center font-bold text-[10px] text-slate-600 uppercase">Hora</div>
                                        {diasSemana.map(dia => (<div key={dia} className="flex-1 text-center py-2.5 font-bold text-[11px] text-slate-700 uppercase border-r border-slate-200 last:border-0">{dia}</div>))}
                                    </div>

                                    {/* Cuerpo del Grid */}
                                    <div className="relative w-full" style={{ height: `${TOTAL_HORAS * 60}px` }}>
                                        <div className="absolute inset-0 flex">
                                            <div className="w-14 shrink-0 border-r border-slate-200 bg-[#F4F7F6]/30 z-10"></div>
                                            {diasSemana.map((_, i) => (<div key={i} className="flex-1 border-r border-slate-100 last:border-0 grid-bg"></div>))}
                                        </div>
                                        
                                        {/* Columna de Horas */}
                                        <div className="absolute top-0 left-0 w-14 text-center text-[10px] text-slate-500 font-bold z-10">
                                            {Array.from({length: TOTAL_HORAS + 1}).map((_, i) => (
                                                <div key={i} className="h-[60px] relative border-b border-slate-100">
                                                    <span className="absolute -top-2 left-0 w-full bg-white/80">{formatHourLine(i + HORA_INICIO)}</span>
                                                </div>
                                            ))}
                                        </div>

                                        {/* Bloques de Clase Renderizados */}
                                        {seccionesAgregadas.map((seccion, sIdx) => {
                                            return seccion.horarios.map((horario, hIdx) => {
                                                const colIndex = diasSemana.indexOf(horario.dia);
                                                if (colIndex === -1) return null;
                                                const startMin = timeToMins(horario.inicio);
                                                const offsetTop = startMin - (HORA_INICIO * 60);
                                                const duration = timeToMins(horario.fin) - startMin;

                                                return (
                                                    <div 
                                                        key={`${sIdx}-${hIdx}`}
                                                        className="absolute class-block rounded-lg bg-[#E3F2FD] border border-[#BBDEFB] p-2 flex flex-col items-center justify-center overflow-hidden z-20 text-center"
                                                        style={{ top: `${offsetTop}px`, height: `${duration}px`, width: `calc((100% - 56px) / 6 - 8px)`, left: `calc(56px + ((100% - 56px) / 6) * ${colIndex} + 4px)` }}
                                                    >
                                                        <span className="font-bold text-[#000000] text-[10px] leading-tight mb-1">{seccion.nombreCurso}</span>
                                                        <span className="font-bold text-[#1E3A8A] text-[9px] mb-1">
                                                            {seccion.codigo} • Sec. {seccion.seccion} <span className="bg-white px-1 py-0.5 rounded border border-blue-100 text-[8px]">{horario.tipo}</span>
                                                        </span>
                                                        <span className="text-[8px] font-bold text-slate-700 truncate w-full mb-1">{horario.docente}</span>
                                                        <span className="text-[9px] font-bold text-slate-600 flex items-center gap-1">
                                                            <i className="fa-regular fa-clock text-[#ef4444]"></i> {horario.inicio} a {horario.fin}
                                                        </span>
                                                    </div>
                                                )
                                            });
                                        })}
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </React.Fragment>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
