                const cursoNombre = cursoNombreCompleto.replace(/-\s*[A-Z0-9]+$/, '').trim();

                const col2Words = col2.split(' ');
                const dia = col2Words.pop();
                let seccion = col2Words.pop();
                let subSeccion = "";
                if (seccion.includes('G)') || seccion.includes('G(')) {
                    subSeccion = seccion; seccion = col2Words.pop() + " " + subSeccion;
                }

                const planMatch = col2.match(/PLAN \d{4}\*? /);
                let docente = "POR DESIGNAR";
                if (planMatch) {
                    const docRaw = col2.substring(col2.indexOf(planMatch[0]) + planMatch[0].length, col2.lastIndexOf(seccion.split(' ')[0]) - 1).trim();
                    docente = docRaw.replace(/\s*-\s*\d+$/, '').trim() || docente;
                }

                const timeMatch = col3.match(/(\d{2}:\d{2})\s+a\s+(\d{2}:\d{2})/);
                if (!timeMatch) return;
                const [inicio, fin] = [timeMatch[1], timeMatch[2]];

                const restCol3 = col3.substring(timeMatch[0].length).trim().split(' ');
                let tipo = "T", cupos = "40";
                const tipoIndex = restCol3.findIndex(w => ['T','P','L'].includes(w));
                if (tipoIndex !== -1) { tipo = restCol3[tipoIndex]; cupos = restCol3[tipoIndex + 1] || "40"; }
                
                let modalIndex = restCol3.findIndex(w => w === 'PRESENCIAL' || w === 'VIRTUAL');
                let aula = modalIndex > 0 ? restCol3.slice(0, modalIndex).join(' ') : "LAB";

                if (!courseMap[cursoNombre]) courseMap[cursoNombre] = { id: cursoNombre, nombre: cursoNombre, codigo, ciclo, creditos: Math.floor(Math.random()*2)+3, seccionesBase: {} };
                
                const baseSeccion = seccion.split(' ')[0];
                if (!courseMap[cursoNombre].seccionesBase[baseSeccion]) courseMap[cursoNombre].seccionesBase[baseSeccion] = { id: `${cursoNombre}_${baseSeccion}`, seccion: baseSeccion, tp: [], labs: {} };

                const claseObj = { dia, inicio, fin, tipo, aula, docente, cupos };
                if (tipo === 'L' || seccion.includes('G')) {
                    if (!courseMap[cursoNombre].seccionesBase[baseSeccion].labs[seccion]) courseMap[cursoNombre].seccionesBase[baseSeccion].labs[seccion] = [];
                    courseMap[cursoNombre].seccionesBase[baseSeccion].labs[seccion].push(claseObj);
                } else {
                    courseMap[cursoNombre].seccionesBase[baseSeccion].tp.push(claseObj);
                }
            });
            return Object.values(courseMap);
        };

        const dbCursos = parseData();
        const borderColors = ['border-blue-500', 'border-emerald-500', 'border-purple-500', 'border-orange-500', 'border-pink-500'];

        // COMPONENTE PRINCIPAL

                let cruces = 0; let totalMins = 0; const bloques = [];
                const uniqueCursos = new Set(); let creds = 0;
                
                seccionesAgregadas.forEach(sec => {
                    if (!uniqueCursos.has(sec.cursoId)) { creds += sec.creditos; uniqueCursos.add(sec.cursoId); }
                    sec.horarios.forEach(hor => {
                        const ini = timeToMins(hor.inicio); const fin = timeToMins(hor.fin);
                        totalMins += (fin - ini);
                        bloques.push({ dia: hor.dia, inicio: ini, fin: fin });
                    });
                });
                
                for(let i=0; i<bloques.length; i++){
                    for(let j=i+1; j<bloques.length; j++){
                        if(bloques[i].dia === bloques[j].dia && bloques[i].inicio < bloques[j].fin && bloques[i].fin > bloques[j].inicio) cruces++;

                            </div>
                            <div className="bg-white rounded-xl p-4 shadow-md border-b-4 border-amber-500 flex items-center gap-4">
                                <div className="w-10 h-10 rounded-full bg-amber-50 text-amber-500 flex items-center justify-center text-lg border border-amber-100"><i className="fa-regular fa-clock"></i></div>
                                <div><p className="text-xl font-black text-slate-800">{totalHoras}h</p><p className="text-[9px] text-slate-500 font-bold uppercase mt-1">Horas semanales</p></div>
                            </div>
                        </div>

                        {/* ÁREA DE TRABAJO (Catálogo y Calendario) */}
                        <div className="px-4 lg:px-6 pt-6 flex flex-col lg:flex-row items-start gap-6 pb-10">
                            
                            {/* CATÁLOGO (Izquierda) */}
                            <div className="w-full lg:w-[350px] shrink-0 bg-white rounded-2xl flex flex-col shadow-lg" style={{height: "750px"}}>
                                <div className="p-5 border-b border-slate-100">
                                    <h2 className="font-black text-lg text-slate-800 mb-4">Catálogo de Cursos</h2>
                                    <div className="space-y-3">
                                        <div className="relative">
                                            <i className="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-slate-400 text-sm"></i>
                                            <input type="text" placeholder="Buscar curso, código o docente... (/)" className="w-full pl-9 pr-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs font-medium focus:outline-none focus:bg-white transition-all" value={busqueda} onChange={(e) => setBusqueda(e.target.value)} />
                                        </div>
                                        <select className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs font-bold text-slate-600 focus:outline-none cursor-pointer" value={filtroCiclo} onChange={(e) => setFiltroCiclo(e.target.value)}>
                                            <option value="Todos">Todos los ciclos</option>
                                            <option value="I">CICLO I</option><option value="II">CICLO II</option><option value="III">CICLO III</option><option value="IV">CICLO IV</option><option value="V">CICLO V</option><option value="VI">CICLO VI</option><option value="VII">CICLO VII</option><option value="VIII">CICLO VIII</option><option value="IX">CICLO IX</option><option value="X">CICLO X</option>
                                        </select>
                                    </div>
                                </div>
                                
                                <div className="flex-1 overflow-y-auto scroll-clean p-4 bg-white">
                                    {Object.keys(cursosPorCiclo).length === 0 ? (
                                        <div className="text-center p-8 text-slate-400"><p className="font-medium text-sm">No se encontraron cursos</p></div>
                                    ) : (
                                        Object.keys(cursosPorCiclo).map(cicloKey => (
                                            <div key={cicloKey} className="mb-6">
                                                <div className="flex justify-between items-center mb-3">
                                                    <span className="font-black text-[10px] text-slate-500 uppercase tracking-widest">CICLO {cicloKey}</span>
                                                    <span className="text-[10px] text-slate-400 font-bold">{cursosPorCiclo[cicloKey].length} cursos <i className="fa-solid fa-chevron-up ml-1"></i></span>
                                                </div>
                                                
                                                {cursosPorCiclo[cicloKey].map((curso, idx) => (
                                                    <div key={curso.id} className="mb-4 bg-white border border-slate-200 rounded-xl overflow-hidden relative shadow-sm hover:border-slate-300">
                                                        <div className={`absolute left-0 top-0 bottom-0 w-1.5 ${borderColors[idx % borderColors.length]}`}></div>
                                                        <div className="p-3 pl-4 border-b border-slate-100">
                                                            <div className="flex justify-between items-start mb-1">
                                                                <h3 className="font-black text-[11px] uppercase text-slate-800 leading-tight pr-2">{curso.nombre}</h3>
                                                                <span className="bg-slate-100 text-slate-600 text-[9px] font-bold px-1.5 py-0.5 rounded whitespace-nowrap">{Object.keys(curso.seccionesBase).length} secc.</span>
                                                            </div>
                                                            <div className="flex items-center gap-1.5 mt-1.5">
                                                                <span className="bg-emerald-50 text-emerald-600 border border-emerald-100 text-[8px] font-black px-1.5 py-0.5 rounded uppercase">{curso.codigo}</span>
                                                                <span className="text-[9px] text-slate-500 font-bold">• {curso.creditos} Créditos</span>
                                                            </div>
                                                        </div>
                                                        <div className="p-2.5 pl-4 space-y-2 bg-slate-50/50">
                                                            {Object.values(curso.seccionesBase).map(base => {
                                                                const hasTP = base.tp.length > 0;
                                                                const labs = Object.keys(base.labs);
                                                                const tpID = `${curso.id}_${base.seccion}_TP`;
                                                                const isTPAdded = seccionesAgregadas.some(s => s.id === tpID);
                                                                const docPrinc = hasTP ? base.tp[0].docente : (labs.length > 0 ? base.labs[labs[0]][0].docente : "");
                                                                const cupos = hasTP ? base.tp[0].cupos : "40";

                                                                return (
                                                                    <div key={base.id} className="space-y-2">
                                                                        {hasTP && (
                                                                            <div className={`border rounded-lg p-2.5 bg-white transition-all ${isTPAdded ? 'border-emerald-500 shadow-sm ring-1 ring-emerald-500/20' : 'border-slate-200'}`}>
                                                                                <div className="flex justify-between items-center mb-2">
                                                                                    <span className="bg-slate-100 text-slate-700 text-[10px] font-bold px-2 py-0.5 rounded">SECCIÓN {base.seccion}</span>
                                                                                    <button onClick={() => toggleSeccion(curso, tpID, base.seccion, base.tp, 'TP')} className={`w-6 h-6 rounded flex items-center justify-center border transition-all ${isTPAdded ? 'bg-emerald-600 border-emerald-600 text-white' : 'bg-slate-50 hover:bg-slate-100 border-slate-200 text-slate-500'}`}>
                                                                                        {isTPAdded ? <i className="fa-solid fa-check text-[10px]"></i> : <i className="fa-solid fa-plus text-[10px]"></i>}
                                                                                    </button>
                                                                                </div>
                                                                                <div className="flex items-center justify-between mb-2 pb-2 border-b border-slate-50">
                                                                                    <span className="text-[9px] font-bold text-slate-600 truncate max-w-[120px]">{docPrinc}</span>
                                                                                    <span className="text-[8px] text-slate-400 font-bold"><i className="fa-solid fa-circle text-[6px] text-emerald-500 mr-1"></i>Vacantes: {cupos}</span>
                                                                                </div>
                                                                                <div className="space-y-1">
                                                                                    {base.tp.map((h, i) => (
                                                                                        <div key={i} className="flex justify-between text-[9.5px]">
                                                                                            <span className="font-black text-slate-700 w-6">{h.dia}</span>
                                                                                            <span className="text-slate-500 font-medium">{h.inicio} a {h.fin}</span>
                                                                                            <span className="bg-slate-100 px-1 rounded text-slate-600 font-bold">{h.aula}</span>
                                                                                        </div>
                                                                                    ))}
                                                                                </div>
                                                                            </div>
                                                                        )}

                                                                        {labs.length > 0 && (
                                                                            <div className="pl-1 space-y-1.5 mt-1">
                                                                                {labs.map(labSec => {
                                                                                    const labHorarios = base.labs[labSec];
                                                                                    const labID = `${curso.id}_${labSec}_LAB`;
                                                                                    const isLabAdded = seccionesAgregadas.some(s => s.id === labID);
                                                                                    const docLab = labHorarios[0].docente;

                                                                                    return (
                                                                                        <div key={labSec} className={`border rounded-lg p-2 bg-white transition-all ${isLabAdded ? 'border-purple-500 shadow-sm ring-1 ring-purple-500/20' : 'border-slate-200'}`}>
                                                                                            <div className="flex justify-between items-center mb-1.5">
                                                                                                <span className="bg-purple-50 text-purple-700 text-[9px] font-bold px-1.5 py-0.5 rounded">SEC {labSec} LAB</span>
                                                                                                <button onClick={() => toggleSeccion(curso, labID, labSec, labHorarios, 'LAB')} className={`w-5 h-5 rounded flex items-center justify-center border transition-all ${isLabAdded ? 'bg-purple-600 border-purple-600 text-white' : 'bg-slate-50 hover:bg-slate-100 border-slate-200 text-slate-500'}`}>
                                                                                                    {isLabAdded ? <i className="fa-solid fa-check text-[9px]"></i> : <i className="fa-solid fa-plus text-[9px]"></i>}
                                                                                                </button>
                                                                                            </div>
                                                                                            <span className="block text-[8px] font-bold text-slate-500 truncate mb-1.5 pb-1.5 border-b border-slate-50">{docLab}</span>
                                                                                            {labHorarios.map((h, i) => (
                                                                                                <div key={i} className="flex justify-between text-[9px]">
                                                                                                    <span className="font-black text-slate-700 w-5">{h.dia}</span>
                                                                                                    <span className="text-slate-500 font-medium">{h.inicio} a {h.fin}</span>
                                                                                                    <span className="font-black text-purple-600">{h.aula}</span>
                                                                                                </div>
                                                                                            ))}
                                                                                        </div>
                                                                                    )
                                                                                })}
                                                                            </div>
                                                                        )}
                                                                    </div>
                                                                )
                                                            })}
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                        ))
                                    )}
                                </div>
                            </div>

                            {/* CALENDARIO Y BOTONES SUPERIORES (Derecha) */}
                            <div className="flex-1 w-full bg-white rounded-2xl border border-slate-200 flex flex-col shadow-lg relative overflow-hidden" style={{height: "750px"}}>
                                {/* BOTONERA HEADER CALENDARIO */}
                                <div className="flex flex-col md:flex-row justify-between items-center px-4 md:px-6 py-4 border-b border-slate-100 bg-white z-20 gap-3">
                                    <h2 className="font-black text-slate-800 text-[15px] flex items-center gap-2">
                                        <i className="fa-regular fa-calendar-days text-emerald-500"></i> Mi Horario <span className="bg-slate-100 text-slate-500 text-[9px] px-2 py-0.5 rounded ml-1 font-bold border border-slate-200 hidden md:inline-block">Horario Semanal</span>
                                    </h2>
                                    <div className="flex flex-wrap items-center justify-end gap-2">
                                        <button onClick={()=>setActiveModal('saved')} className="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1.5 rounded-lg text-[11px] font-bold shadow-sm transition flex items-center gap-1.5"><i className="fa-solid fa-floppy-disk"></i> <span className="hidden lg:inline">Guardar horario</span></button>
                                        <button onClick={limpiarHorario} className="bg-white hover:bg-red-50 text-red-500 border border-red-200 px-3 py-1.5 rounded-lg text-[11px] font-bold transition flex items-center gap-1.5"><i className="fa-regular fa-trash-can"></i> <span className="hidden lg:inline">Vaciar Horario</span></button>
                                        <button onClick={()=>setSeccionesAgregadas([...seccionesAgregadas])} className="bg-white hover:bg-slate-50 border border-slate-200 w-8 h-8 rounded-lg text-slate-400 flex items-center justify-center transition"><i className="fa-solid fa-rotate-left text-[11px]"></i></button>
                                        <button onClick={()=>setActiveModal('download')} className="bg-[#00897b] hover:bg-teal-700 text-white px-3 py-1.5 rounded-lg text-[11px] font-bold shadow-sm transition flex items-center gap-1.5"><i className="fa-solid fa-download"></i> Descargar Horario <i className="fa-solid fa-chevron-down text-[9px]"></i></button>
                                    </div>
                                </div>

                                {/* GRILLA CALENDARIO OVERFLOW */}
                                <div className="flex-1 overflow-x-auto overflow-y-auto relative bg-white scroll-clean">
                                    <div ref={calendarRef} id="calendario-exportar" className="relative bg-white min-w-[700px] w-full" style={{ height: `${TOTAL_HORAS * 60 + 40}px` }}>
                                        
                                        <div className="flex border-b border-slate-200 bg-slate-50 sticky top-0 z-30">
                                            <div className="w-14 border-r border-slate-200 shrink-0 flex items-center justify-center font-black text-[10px] text-slate-600 uppercase tracking-widest bg-slate-50">HORA</div>
                                            {diasSemana.map(dia => (<div key={dia} className="flex-1 text-center py-3 font-black text-[11px] text-slate-800 uppercase tracking-widest border-r border-slate-200 last:border-0 bg-slate-50">{dia}</div>))}
                                        </div>

                                        <div className="relative w-full" style={{ height: `${TOTAL_HORAS * 60}px` }}>
                                            <div className="absolute inset-0 flex">
                                                <div className="w-14 shrink-0 border-r border-slate-200 bg-slate-50/50 z-10"></div>
                                                {diasSemana.map((_, i) => (<div key={i} className="flex-1 border-r border-slate-100 last:border-0 grid-bg"></div>))}
                                            </div>
                                            
                                            <div className="absolute top-0 left-0 w-14 text-center text-[10px] text-slate-500 font-bold z-10">
                                                {Array.from({length: TOTAL_HORAS + 1}).map((_, i) => (
                                                    <div key={i} className="h-[60px] relative border-b border-slate-100 bg-slate-50/50">
                                                        <span className="absolute -top-2 left-0 w-full"><span className="text-slate-800 font-black">{String(i + HORA_INICIO).padStart(2, '0')}</span>:00</span>
                                                    </div>
                                                ))}
                                            </div>

                                            {/* RENDER DE CURSOS EN CALENDARIO */}
                                            {seccionesAgregadas.map((seccion, sIdx) => {
                                                const bgClass = seccion.itemType === 'LAB' ? 'bg-[#dcfce7] border-[#6ee7b7] text-[#065f46]' : 'bg-[#e0f2fe] border-[#7dd3fc] text-[#075985]';
                                                
                                                return seccion.horarios.map((horario, hIdx) => {
                                                    const colIndex = diasSemana.indexOf(horario.dia);
                                                    if (colIndex === -1) return null;
                                                    const startMin = timeToMins(horario.inicio);
                                                    const offsetTop = startMin - (HORA_INICIO * 60);
                                                    const duration = timeToMins(horario.fin) - startMin;

                                                    return (
                                                        <div key={`${sIdx}-${hIdx}`} className={`absolute rounded-lg border flex flex-col items-center justify-center text-center p-1.5 overflow-hidden z-20 class-block shadow-sm ${bgClass}`}
                                                             style={{ top: `${offsetTop}px`, height: `${duration}px`, width: `calc((100% - 56px) / 6 - 8px)`, left: `calc(56px + ((100% - 56px) / 6) * ${colIndex} + 4px)` }}>
                                                            
                                                            <span className="font-black text-[9.5px] leading-tight uppercase line-clamp-2">{seccion.nombreCurso}</span>
                                                            <div className="mt-1 flex items-center justify-center gap-1 text-[8.5px] font-black opacity-80">
                                                                {seccion.cursoId} • Sec. {seccion.seccion} <span className="bg-white/80 border border-white/50 px-1 rounded shadow-sm">{horario.tipo}</span>
                                                            </div>
                                                            <span className="font-bold text-[8px] mt-1 truncate w-full opacity-90">{horario.docente}</span>
                                                            <span className="font-black text-[8.5px] mt-0.5 opacity-80"><i className="fa-regular fa-clock mr-0.5"></i> {horario.inicio} a {horario.fin}</span>
                                                        </div>
                                                    )
                                                });
                                            })}
                                        </div>
                                    </div>
                                    
                                    {/* MESA VACÍA */}
                                    {seccionesAgregadas.length === 0 && (
                                        <div className="absolute inset-0 flex flex-col items-center justify-center pointer-events-none z-30">
                                            <div className="bg-white p-6 rounded-2xl shadow-xl border border-slate-100 flex flex-col items-center text-center max-w-[280px]">
                                                <div className="w-14 h-14 bg-emerald-50 rounded-full flex items-center justify-center mb-3"><i className="fa-regular fa-calendar-check text-2xl text-emerald-500"></i></div>
                                                <h3 className="text-sm font-black text-slate-800 mb-1">Arma tu horario ideal</h3>
                                                <p className="text-[11px] text-slate-500 mb-4 font-medium px-2 leading-relaxed">Haz clic en cualquier curso del catálogo a la izquierda para comenzar a armar tu horario semanal.</p>
                                                <button className="bg-[#5c4cfc] text-white font-bold py-2 px-5 rounded-lg text-xs shadow-md pointer-events-auto w-full"><i className="fa-solid fa-magnifying-glass mr-2"></i>Buscar cursos</button>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>

                        {/* FOOTER HIGH-TECH 3D */}
                        <footer className="tech-footer">
                            <div className="tech-globe-container">
                                <div className="tech-globe">
                                    <div className="tech-ring"></div><div className="tech-ring"></div><div className="tech-ring"></div>
                                    <div className="tech-ring"></div><div className="tech-ring"></div><div className="tech-ring"></div>
                                    <div className="tech-ring"></div><div className="tech-core"></div>
                                </div>
                            </div>
                            <div className="neon-creator">SISTEMA CREADO POR SEBASTIAN</div>
                            <div className="tech-copyright">© 2026 UNAC - Movilidad Universitaria. Todos los derechos reservados.</div>
                        </footer>

                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
